[pytest]
# Pytest configuration for Backend_FastAPI tests

# Custom markers
markers =
    slow: marks tests as slow-running (e.g., performance tests)
    integration: marks tests as integration tests requiring external services (e.g., Celery, Redis)

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Asyncio mode (for pytest-asyncio)
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning:engineio
    ignore::DeprecationWarning:pydantic
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::DeprecationWarning:passlib
