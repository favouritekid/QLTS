[pytest]
# Pytest configuration for Backend_FastAPI tests

# Custom markers
markers =
    slow: marks tests as slow-running (e.g., performance tests)
    integration: marks tests as integration tests requiring external services (e.g., Celery, Redis)
    unit: marks tests as unit tests (fast, no external dependencies)
    security: marks tests as security-focused tests
    performance: marks tests as performance/stress tests
    e2e: marks tests as end-to-end tests
    regression: marks tests as regression tests
    refactoring: marks tests as refactoring verification tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Asyncio mode (for pytest-asyncio)
asyncio_mode = auto

# Warnings
filterwarnings =
    ignore::DeprecationWarning:engineio
    ignore::DeprecationWarning:pydantic
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore::DeprecationWarning:passlib
