# Backend_FastAPI/pytest.ini
[pytest]
addopts = -s -v
log_cli = true
log_cli_level = WARNING
asyncio_mode = strict

# Thêm dòng này để bảo pytest-dotenv không tự động tải bất kỳ file .env nào
env_files =

# === Giữ lại cấu hình log level nếu cần ===
; log_levels =
;     sqlalchemy = WARNING
;     alembic = WARNING

filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning:passlib.*:
    ignore:Using default CasbinRule table.*:RuntimeWarning:casbin_async_sqlalchemy_adapter.*:

markers =
    integration: marks tests as integration tests (requires external services like DB, Redis, Celery worker)
    # Thêm các marker khác nếu bạn dùng
    # Thêm các bộ lọc khác nếu cần ở dòng mới