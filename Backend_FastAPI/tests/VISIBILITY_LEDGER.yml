    ở nightly và chưa được vá, nên đưa cả tệp vào tier sẽ làm đỏ mọi PR. Ghi
    nhận là nợ có tên thay vì để nó vô hình. Vá nợ này rồi thì nâng lên
    whole-file và xoá mục này.
