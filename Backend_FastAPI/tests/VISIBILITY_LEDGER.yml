# Sổ khai ngoại lệ độ-nhìn-thấy của test.
#
# Cổng: .github/scripts/pytest_visibility_guard.py
# Kiểm lược đồ + nối dây: tests/unit/test_ci_test_visibility.py
#
# Sổ này KHÔNG phải nơi ghi nợ cũ. 387 tệp đang đứng ngoài mọi tier vẫn đứng
# ngoài và không cần khai ở đây — cổng chỉ hỏi tới một tệp khi tệp ấy (hoặc
# selector/ledger của nó) VỪA THAY ĐỔI. Thêm mục vào đây nghĩa là: "tôi đã xem,
# và đây là lý do nó chưa được gate trọn vẹn".
#
# Hai trạng thái, không có trạng thái thứ ba:
#
#   partial       tệp CÓ nodeid trong tier nhưng KHÔNG có selector whole-file.
#                 Bắt buộc: reason · blob · nodeids khớp CHÍNH XÁC tập trong
#                 tier · nightly vẫn thu thập tệp.
#
#   nightly-only  tệp KHÔNG có selector nào trong PR gate, dựa hoàn toàn vào
#                 nightly. Bắt buộc: reason · blob · KHÔNG khai nodeids ·
#                 nightly vẫn thu thập tệp.
#
# `blob` ghim tệp ở PHIÊN BẢN ĐÃ ĐƯỢC XEM. Sửa nội dung ⇒ blob đổi ⇒ cổng đỏ
# cho tới khi mục này được cập nhật. Đó là chủ ý: nó buộc ngoại lệ phải được
# xem lại thay vì sống mãi. Lấy giá trị mới bằng:
#
#   git rev-parse HEAD:Backend_FastAPI/<path>
#
# Được nâng lên whole-file selector ⇒ PHẢI XOÁ mục tương ứng, nếu không cổng
# báo ledger lỗi thời.
