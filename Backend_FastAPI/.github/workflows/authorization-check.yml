name: Authorization Guardrails

on:
  pull_request:
    paths:
      - 'app/**/*.py'
      - 'scripts/**/*.py'

jobs:
  auth-guardrails:
    name: Authorization Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ============================================================
      # GUARDRAIL 1: No inline role checks in routers
      # ============================================================
      - name: Check for inline role checks in routers
        run: |
          echo "Checking for inline role checks (user.role ==) in routers..."
          if grep -rn "user\.role ==" app/routers/ --include="*.py"; then
            echo ""
            echo "========================================"
            echo "FAIL: Inline role check detected in router"
            echo "========================================"
            echo ""
            echo "FIX: Move role check to deps.py dependency"
            echo "     Use: require_admin, require_admin_or_manager, etc."
            echo ""
            echo "Reference: AUTHORIZATION_GUIDELINES.md Section 3"
            exit 1
          fi
          echo "PASS: No inline role checks found"

      # ============================================================
      # GUARDRAIL 2: No current_user.role == in routers
      # ============================================================
      - name: Check for current_user.role checks
        run: |
          echo "Checking for current_user.role checks in routers..."
          if grep -rn "current_user\.role ==" app/routers/ --include="*.py"; then
            echo ""
            echo "========================================"
            echo "FAIL: current_user.role check in router"
            echo "========================================"
            echo ""
            echo "FIX: Use dependency injection instead"
            echo "     - CasbinAuth for dynamic checks"
            echo "     - require_admin for static checks"
            exit 1
          fi
          echo "PASS: No current_user.role checks found"

      # ============================================================
      # GUARDRAIL 3: No db.get() in routers (IDOR risk)
      # ============================================================
      - name: Check for db.get() in routers (IDOR risk)
        run: |
          echo "Checking for direct db.get() in routers..."
          # Check for common IDOR patterns
          if grep -rn "await db\.get\|db\.get(" app/routers/ --include="*.py" | grep -v "# IDOR-SAFE"; then
            echo ""
            echo "========================================"
            echo "FAIL: Direct db.get() in router (IDOR risk)"
            echo "========================================"
            echo ""
            echo "FIX: Use get_{resource}_for_user dependency"
            echo "     This ensures ownership check before access"
            echo ""
            echo "If this is intentionally safe, add comment: # IDOR-SAFE: <reason>"
            echo ""
            echo "Reference: AUTHORIZATION_GUIDELINES.md Section 4"
            exit 1
          fi
          echo "PASS: No unsafe db.get() calls found"

      # ============================================================
      # GUARDRAIL 4: No HTTPException in services
      # ============================================================
      - name: Check for HTTPException in services
        run: |
          echo "Checking for HTTPException imports in services..."
          if grep -rn "from fastapi import.*HTTPException\|from fastapi.exceptions import HTTPException" app/services/ --include="*.py"; then
            echo ""
            echo "========================================"
            echo "FAIL: HTTPException in service layer"
            echo "========================================"
            echo ""
            echo "FIX: Raise domain exceptions instead"
            echo "     - ResourceNotFoundError"
            echo "     - PermissionDeniedError"
            echo "     - BusinessRuleViolation"
            echo ""
            echo "Reference: MASTER_ARCHITECTURE.md Part 2.2"
            exit 1
          fi
          echo "PASS: No HTTPException in services"

      # ============================================================
      # GUARDRAIL 5: Router authorization check
      # ============================================================
      - name: Check router authorization coverage
        run: |
          echo "Running router authorization check..."
          python scripts/check_router_auth.py

      # ============================================================
      # SUMMARY
      # ============================================================
      - name: Authorization check summary
        if: success()
        run: |
          echo ""
          echo "========================================"
          echo "ALL AUTHORIZATION GUARDRAILS PASSED"
          echo "========================================"
          echo ""
          echo "Checked:"
          echo "  - No inline role checks in routers"
          echo "  - No current_user.role checks in routers"
          echo "  - No unsafe db.get() calls (IDOR)"
          echo "  - No HTTPException in services"
          echo "  - All router endpoints have authorization"
