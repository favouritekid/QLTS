# QLTS Architecture Linting Rules
# ================================
# These Semgrep rules enforce architectural patterns established in our codebase.
# Run: semgrep --config .semgrep/rules/architecture.yml app/
#
# Rules enforce:
# 1. Repository Pattern - Services must not use direct db.execute
# 2. HTTPException Ban - Services must use custom exceptions
# 3. Transaction Management - Services must not call db.commit()
# 4. Service Layer Purity - Routers must not contain business logic

rules:

  # ============================================================================
  # RULE 1: No HTTPException in Services
  # ============================================================================
  # Services should use custom exceptions (ResourceNotFoundError, etc.)
  # Router layer handles conversion to HTTP responses
  
  - id: no-httpexception-in-services
    patterns:
      - pattern-either:
          - pattern: raise HTTPException(...)
          - pattern: from fastapi import HTTPException
          - pattern: from fastapi.exceptions import HTTPException
    paths:
      include:
        - "**/app/services/**/*.py"
    message: |
      ❌ ARCHITECTURE VIOLATION: HTTPException not allowed in service layer.
      
      Services should raise custom exceptions:
      - ResourceNotFoundError
      - DuplicateResourceError
      - BadRequest
      
      Import from: from app.utils.exceptions import ResourceNotFoundError
      
      The router layer handles converting these to HTTPException.
    severity: ERROR
    languages:
      - python
    metadata:
      category: architecture
      rule-type: service-layer

  # ============================================================================
  # RULE 2: No db.commit() in Services
  # ============================================================================
  # Transaction management is handled by routers
  # Services should use db.flush() and return post-commit callbacks
  
  - id: no-db-commit-in-services
    pattern: await $DB.commit()
    paths:
      include:
        - "**/app/services/**/*.py"
      exclude:
        # These services handle their own transactions for specific reasons
        - "**/app/services/notification_dispatcher.py"
        - "**/app/services/notification_preference_service.py"
    message: |
      ❌ ARCHITECTURE VIOLATION: db.commit() not allowed in service layer.
      
      Services should:
      1. Use await db.flush() after changes
      2. Return a post-commit callback: return (result, _post_commit)
      3. Let the Router call db.commit() and then await _post_commit()
      
      Pattern:
        async def create_something(db, ...):
            db.add(obj)
            await db.flush()
            async def _post_commit():
                # Post-commit logic (notifications, cache invalidation)
                pass
            return obj, _post_commit
    severity: ERROR
    languages:
      - python
    metadata:
      category: architecture
      rule-type: transaction-management

  # ============================================================================
  # RULE 3: Prefer Repository Pattern in Services
  # ============================================================================
  # Direct db.execute() calls should be minimized
  # Use Repository classes for data access
  
  - id: prefer-repository-pattern
    pattern: await $DB.execute(...)
    paths:
      include:
        - "**/app/services/**/*.py"
      exclude:
        # These services are allowed exceptions (pending future migration)
        - "**/app/services/notification_dispatcher.py"
        - "**/app/services/notification_*.py"
        - "**/app/services/session_service.py"
        - "**/app/services/anomaly_detection.py"
        - "**/app/services/casbin_service.py"
    message: |
      ⚠️ ARCHITECTURE WARNING: Consider using Repository pattern.
      
      Direct db.execute() should be moved to Repository classes:
      - LeadRepository
      - UserRepository
      - OrganizationRepository
      - ApplicationRepository
      - PipelineRepository
      
      Example:
        # Before (service)
        result = await db.execute(select(Model).where(...))
        
        # After (service)
        from app.repositories import MyRepository
        repo = MyRepository(db)
        result = await repo.get_by_id(...)
      
      Note: Some complex queries may be acceptable exceptions.
    severity: WARNING
    languages:
      - python
    metadata:
      category: architecture
      rule-type: repository-pattern

  # ============================================================================
  # RULE 4: No db.scalar() direct calls in Services
  # ============================================================================
  
  - id: no-db-scalar-in-services
    pattern: await $DB.scalar(...)
    paths:
      include:
        - "**/app/services/**/*.py"
      exclude:
        - "**/app/services/notification_*.py"
        - "**/app/services/config_service.py"
    message: |
      ⚠️ ARCHITECTURE WARNING: Direct db.scalar() should use Repository.
      
      Move this query to the appropriate Repository class.
    severity: WARNING
    languages:
      - python
    metadata:
      category: architecture
      rule-type: repository-pattern

  # ============================================================================
  # RULE 5: Routers must not have business logic
  # ============================================================================
  # Complex if/else, loops with logic should be in services
  
  - id: no-complex-logic-in-routers
    patterns:
      - pattern-either:
          - pattern: |
              for $ITEM in $COLLECTION:
                  if $CONDITION:
                      ...
          - pattern: |
              while $CONDITION:
                  ...
    paths:
      include:
        - "**/app/api/**/*.py"
    message: |
      ⚠️ ARCHITECTURE WARNING: Complex logic detected in router.
      
      Routers should only:
      - Parse request parameters
      - Call service functions
      - Handle transactions (commit/rollback)
      - Return responses
      
      Move business logic to service layer.
    severity: WARNING
    languages:
      - python
    metadata:
      category: architecture
      rule-type: router-purity

