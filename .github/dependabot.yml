# Dependabot — cập nhật phụ thuộc chủ động
# ========================================
# Bổ trợ cho `dependency-audit.yml`: audit CHẶN khi đã có lỗ hổng, còn
# Dependabot MỞ SẴN PR vá trước khi bị chặn.
#
# ⚠️ Chi phí CI: mỗi PR kích một vòng check, trong đó `pytest` ≈ 51 phút.
# Vì vậy các bản minor/patch được GOM vào 1 PR mỗi nhóm mỗi tuần thay vì
# mỗi package một PR. Bản major luôn tách riêng (breaking — cần đọc kỹ).
#
# Lưu ý: file này chỉ điều khiển VERSION updates. SECURITY updates (vá CVE
# ngoài lịch) là tính năng riêng, bật ở Settings → Code security →
# "Dependabot security updates".

version: 2
updates:
  # ---------------------------------------------------------------- frontend
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    groups:
      # Phụ thuộc SHIP RA RUNTIME — ưu tiên cao nhất, đúng phạm vi gate
      # `npm audit --omit=dev` trong dependency-audit.yml
      frontend-runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      # Toolchain (eslint/vitest/playwright/tailwind…) — gộp 1 PR
      frontend-toolchain:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "frontend"

  # ----------------------------------------------------------------- backend
  - package-ecosystem: "pip"
    directory: "/Backend_FastAPI"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"

  # -------------------------------------------------------- GitHub Actions
  # actions/checkout, setup-node, setup-python… — nơi hay tồn tại action
  # bị bỏ hoang hoặc bị chiếm quyền (supply chain).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    groups:
      ci-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"

  # ------------------------------------------------------------ base images
  # node:20-alpine / python:3.12-slim — vá lỗ hổng ở tầng OS của image.
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/Backend_FastAPI"
    schedule:
      interval: "monthly"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(docker)"
    labels:
      - "dependencies"
      - "docker"
