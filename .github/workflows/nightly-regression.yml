name: Nightly Regression Tests

on:
  schedule:
    # Run at 2:00 AM UTC daily (9:00 AM Vietnam time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suite names (lead,admission,finance,bugfix,unified,smoke) or "all"'
        required: false
        default: 'all'

jobs:
  regression:
    name: E2E Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Inject all env vars referenced by ``docker-compose.yml`` interpolation
    # (root cause of 10/10 fail runs through 2026-05-24 — see PR #332 body).
    # CI test creds are intentionally unsafe placeholders; the stack only
    # binds to localhost inside this runner and is torn down on job end.
    env:
      POSTGRES_USER: qlts
      POSTGRES_PASSWORD: ci-test-postgres-pw
      POSTGRES_DB: qlts_test
      DOMAIN: localhost
      NEXT_PUBLIC_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Generate ``.env.production`` so the backend service's ``env_file:``
      # directive resolves (it's referenced unconditionally in
      # docker-compose.yml). Values are CI-only placeholders mirroring the
      # pattern used by backend-test.yml + nightly-backend-pytest.yml.
      - name: Generate .env.production for backend env_file load
        run: |
          cat > .env.production <<EOF
          APP_ENV=production
          SECRET_KEY=ci-test-secret-key-for-nightly-only
          JWT_SECRET_KEY=ci-test-jwt-secret-for-nightly-only
          MAIL_USERNAME=ci-test@example.com
          MAIL_PASSWORD=ci-test-placeholder
          MAIL_FROM=ci-test@example.com
          MAIL_SERVER=smtp.example.com
          EOF

      # ``-f docker-compose.yml`` bypasses the auto-loaded
      # ``docker-compose.override.yml`` (dev mode) which requires
      # ``Backend_FastAPI/.env`` that doesn't exist in CI. We want the
      # production-like stack here anyway.
      - name: Start services
        run: |
          docker compose -f docker-compose.yml up -d postgres redis backend frontend
          docker compose -f docker-compose.yml exec -T backend alembic upgrade head
          # Wait for services
          timeout 60 bash -c 'until curl -sf http://localhost:8000/docs > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Services ready"

      # Seed data (required for E2E tests)
      - name: Seed database
        run: |
          docker compose -f docker-compose.yml exec -T backend pip install -r requirements-dev.txt -q
          docker compose -f docker-compose.yml exec -T backend python -m scripts.seed_from_xlsx
          docker compose -f docker-compose.yml exec -T backend python -m app.scripts.seed_notification_rules

      # --- Regression Suites ---
      - name: E2E — Lead workflow
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'lead'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/lead-workflow.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Admission lifecycle
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'admission'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/admission-lifecycle.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Finance lifecycle
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'finance'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/finance-lifecycle.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Bugfix regression
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'bugfix'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/bugfix-regression.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Unified workflow
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'unified'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/lead-to-admission-workflow.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Smoke tests
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'smoke'))
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/smoke-all-pages.spec.ts src/test/e2e/admission-ui-smoke.spec.ts --project=chromium --reporter=list

      # Upload test artifacts on failure
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml down -v
