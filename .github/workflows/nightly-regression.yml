name: Nightly Regression Tests

on:
  schedule:
    # Run at 2:00 AM UTC daily (9:00 AM Vietnam time)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: 'Comma-separated suite names (lead,admission,finance,bugfix,unified,smoke) or "all"'
        required: false
        default: 'all'

jobs:
  regression:
    name: E2E Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Start full stack via docker compose
      - name: Start services
        run: |
          docker compose up -d postgres redis backend frontend
          docker compose exec -T backend alembic upgrade head
          # Wait for services
          timeout 60 bash -c 'until curl -sf http://localhost:8000/docs > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'
          echo "Services ready"

      # Seed data (required for E2E tests)
      - name: Seed database
        run: |
          docker compose exec -T backend pip install -r requirements-dev.txt -q
          docker compose exec -T backend python -m scripts.seed_from_xlsx
          docker compose exec -T backend python -m app.scripts.seed_notification_rules

      # --- Regression Suites ---
      - name: E2E — Lead workflow
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'lead'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/lead-workflow.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Admission lifecycle
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'admission'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/admission-lifecycle.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Finance lifecycle
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'finance'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/finance-lifecycle.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Bugfix regression
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'bugfix'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/bugfix-regression.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Unified workflow
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'unified'))
        working-directory: frontend
        env:
          E2E_API_URL: http://localhost:8000
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/lead-to-admission-workflow.spec.ts --project=e2e-workflow --reporter=list --workers=1

      - name: E2E — Smoke tests
        if: always() && (github.event.inputs.suites == 'all' || contains(github.event.inputs.suites, 'smoke'))
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test src/test/e2e/smoke-all-pages.spec.ts src/test/e2e/admission-ui-smoke.spec.ts --project=chromium --reporter=list

      # Upload test artifacts on failure
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose down -v
