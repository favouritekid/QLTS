name: Frontend Test (PR Gate)

# PR-CO-1 (Phase 3 close-out plan v2 LOCKED 2026-05-14)
# Fixes FU #126 P0 infra debt: previously FE lint/test/build only ran on push:main
# via deploy.yml. Bundle 1 hotfix #274 surfaced react-hooks/set-state-in-effect
# rule (Next.js 16+ stricter) only at deploy gate, not PR gate.
#
# Cross-file sync (memory `ci-workflow-flag-cross-file-sync`):
#   node-version '20'                     — matches deploy.yml:144 + dependency-audit.yml:99 + nightly-regression.yml:26
#   cache: 'npm'                          — matches deploy.yml:145 + nightly-regression.yml:27
#   cache-dependency-path: frontend/...   — matches deploy.yml:146 + nightly-regression.yml:28
#
# Performance budget: <4 phút median, <6 phút p95.
# Fallback if >6 phút median sau 1w soak: investigate slowest job, consider
# splitting vitest into shards or aggressive `.next/cache` pinning.

on:
  pull_request:
    # Hotfix R15: skip CI on draft PRs (still run on ready_for_review).
    # Reduces Actions minutes burn during hot-iteration drafting.
    types: [opened, synchronize, reopened, ready_for_review]
    # Branch protection requires `Build` and `Check (type+lint+test)` to
    # pass on every PR. Path filter must catch every PR type or those
    # required gates report "expected, not run" and the PR is
    # unmergeable. Workflow-only PRs trigger here defensively so CI/CD
    # refactors are still validated against the FE build pipeline.
    paths:
      - 'frontend/**'
      - 'Backend_FastAPI/**'
      - '.github/workflows/**'
      # `.github/dependabot.yml` và `.github/scripts/**` KHÔNG khớp
      # `.github/workflows/**`. Thiếu 2 dòng này thì một PR chỉ chỉnh
      # dependabot.yml hoặc script audit sẽ treo vĩnh viễn ở
      # "expected, not run" và không thể merge.
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      # `tests-e2e/**` cũng KHÔNG khớp dòng nào ở trên. PR #650 (hợp
      # đồng ca kiểm E2E nginx) chỉ chạm thư mục này, nên workflow không kích
      # hoạt và `Build` + `Check (type+lint+test)` treo ở "expected, not run" —
      # đúng cái bẫy mà chú thích ngay trên mô tả, chỉ là thiếu mất một dòng.
      - 'tests-e2e/**'
  # 23-11-2026 — CHẠY TAY trên một nhánh ĐÃ ĐẨY mà KHÔNG mở PR (vd. `ci/<việc>`):
  #
  #     gh workflow run frontend-test.yml --ref ci/<nhánh>
  #
  # ⚠️ Chỉ dùng được khi khối này đã có trên nhánh MẶC ĐỊNH (`main`) VÀ trên
  # nhánh được chạy. Cây được test là HEAD của nhánh, không phải commit merge
  # tạm với base. Hai check mang tên `<tên> [workflow_dispatch]` (xem `name:`
  # của job) để không thoả required check `Build` / `Check (type+lint+test)` của
  # một PR trùng SHA. Khoá ở `test_ci_test_visibility.py::TestWorkflowDispatchHaiCongPR`.
  workflow_dispatch:

# Một scope ⇒ mọi scope khác `none`. `contents: read` đủ cho checkout; không
# bước nào gọi API hay dùng secret. Ghim để lượt dispatch (nhận quyền mặc định
# của repo, hiện `read`) không bao giờ cầm token ghi nếu cài đặt repo bị đổi.
permissions:
  contents: read

# PR: ref `refs/pull/<số>/merge`; dispatch: `refs/heads/<nhánh>` ⇒ không chung
# nhóm, dispatch không huỷ được lượt PR nào.
concurrency:
  group: fe-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fe-check:
    # Hotfix R14: collapse the 4-way matrix into 2 jobs so we pay the
    # ``npm ci`` install cost twice instead of four times. The cheap
    # checks (type-check + lint + vitest) bundle into a single job; the
    # expensive ``next build`` keeps its own runner for parallelism.
    # Result: wall-clock budget <4 phút median holds even on cold cache.
    #
    # Tên check = `matrix.task.name` CHỈ trên lượt `pull_request` (đúng hai
    # context ruleset 16381130 đòi). Sự kiện khác ⇒ `<tên> [<sự kiện>]`.
    name: ${{ github.event_name == 'pull_request' && matrix.task.name || format('{0} [{1}]', matrix.task.name, github.event_name) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: 'Check (type+lint+test)'
            cmd: 'npm run type-check && npm run lint && npx vitest run --reporter=default'
          - name: 'Build'
            cmd: 'npm run build'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ${{ matrix.task.name }}
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: ${{ matrix.task.cmd }}
