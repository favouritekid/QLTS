# Dependency Vulnerability Audit
# ===============================
# Scans Python and Node.js dependencies for known vulnerabilities
# OWASP A06:2021 - Vulnerable and Outdated Components

name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - 'Backend_FastAPI/requirements.txt'
      - 'frontend/package-lock.json'
      - 'frontend/package.json'
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  python-audit:
    name: Python Dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend_FastAPI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          echo "🔍 Auditing Python dependencies..."
          # --ignore-vuln allowlist (vulns with no fix or disputed by upstream):
          #   - CVE-2024-23342: ecdsa side-channel — maintainer considers out of scope
          #   - PYSEC-2026-89:  markdown 3.10.2 DoS — "fixed in 3.8.1" per DB but
          #     newer 3.10.x line still flagged; no actual fix version available
          #     at time of pinning. Re-evaluate on next pip-audit DB refresh.
          #   - PYSEC-2025-183: pyjwt weak-encryption DISPUTED by supplier
          #     (key length is application's responsibility, not library)
          #   - PYSEC-2026-161: starlette 0.49.1 Host header validation. Verified
          #     NOT exploitable in QLTS by code audit 2026-05-23 (PR #324):
          #       * 0 uses of str(request.url) / request.base_url / url_for() /
          #         request.headers.get("host") in Backend_FastAPI/app/
          #       * 18 uses of request.url.path are PATH-ONLY (from HTTP request
          #         line, Host-independent)
          #       * URL generation uses settings.FRONTEND_URL (deploy-time env)
          #       * CSRF middleware uses Double-Submit Cookie (cookie + header),
          #         not Host header
          #       * frontend/src/ grep: 0 Host-dependent patterns
          #     Defence-in-depth gap (nginx forwards Host unsanitized) + proper
          #     fix (starlette 1.x requires coordinated fastapi 0.122+ upgrade)
          #     tracked in memory entries:
          #       - nginx-host-validation-gap-2026-05-23 (deadline 2026-05-30)
          #       - starlette-fastapi-coordinated-upgrade-debt (deadline 2026-06-22)
          IGNORE_ARGS="--ignore-vuln CVE-2024-23342 --ignore-vuln PYSEC-2026-89 --ignore-vuln PYSEC-2025-183 --ignore-vuln PYSEC-2026-161"
          pip-audit -r requirements.txt --format json --output audit-results.json \
            $IGNORE_ARGS || true

          # Parse results (handle missing output file)
          if [ ! -f audit-results.json ]; then
            echo "⚠️ pip-audit failed to produce output — treating as error"
            pip-audit -r requirements.txt --desc $IGNORE_ARGS || true
            exit 1
          fi

          VULNS=$(python -c "
          import json
          with open('audit-results.json') as f:
              data = json.load(f)
          vulns = data.get('dependencies', [])
          count = sum(len(d.get('vulns', [])) for d in vulns)
          print(count)
          ")

          echo "📊 Found $VULNS vulnerability(ies)"

          # Show human-readable output
          pip-audit -r requirements.txt --desc $IGNORE_ARGS || true

          if [ "$VULNS" -gt "0" ]; then
            echo "⚠️ Vulnerabilities found in Python dependencies!"
            exit 1
          fi

          echo "✅ Python dependency audit passed!"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-audit-results
          path: Backend_FastAPI/audit-results.json

  node-audit:
    name: Node.js Dependencies
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "🔍 Auditing Node.js dependencies..."
          npm audit --json > audit-results.json 2>&1 || true

          # Parse results
          VULNS=$(node -e "
          const data = require('./audit-results.json');
          const meta = data.metadata || {};
          const total = (meta.vulnerabilities || {});
          const count = (total.high || 0) + (total.critical || 0);
          console.log(count);
          ")

          echo "📊 Found $VULNS high/critical vulnerability(ies)"

          # Show human-readable output
          npm audit --omit=dev || true

          if [ "$VULNS" -gt "0" ]; then
            echo "⚠️ High/critical vulnerabilities found in Node.js dependencies!"
            exit 1
          fi

          echo "✅ Node.js dependency audit passed!"

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-audit-results
          path: frontend/audit-results.json
