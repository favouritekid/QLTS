name: Backend Test (PR Gate)

# Touched 2026-05-14 alongside PR #288 (.gitignore cleanup) AND PR #289
# (Documents/scripts inventory batch) only to trigger this gate —
# branch protection ruleset 16381130 requires ``pytest`` on every PR,
# but root-level / Documents/ only PRs do not match any path filter
# below and would otherwise sit at "expected, not run" forever.
# ``scripts/**`` WAS ADDED to the path filter (2026-07-02, PR #459) so
# deploy/ops-script PRs trigger the gate (surfaced when a deploy.sh-only
# fix stuck at "expected, not run"). Future Documents/root-only PRs:
# bundle a no-op workflow touch like this OR expand the path filter
# below explicitly (trade-off: gate runs on every such change).
#
# Sprint S2 hardening (memory `auto-merge-requires-full-ci-not-just-green`):
# Closes the systemic gap surfaced by PR #283 orphan-merge. The existing
# admission-contract-check.yml has a path filter (`services/admission*.py`,
# `core/events*.py`, ...) that DOES NOT include `Backend_FastAPI/tests/**`.
# Result: a test-only PR (e.g., #283 PR-CO-4) could auto-merge with only
# Dependency Audit running — the actual pytest suite that the PR modified
# never ran in CI. The M1 fix shipped post-merge as an orphan commit
# (PR #284 cherry-pick repair). This workflow eliminates that gap.
#
# Cross-file sync (memory `ci-workflow-flag-cross-file-sync`):
#   python-version '3.12'   — matches deploy.yml + dependency-audit.yml
#   cache: 'pip'            — matches deploy.yml
#   cache-dependency-path   — matches deploy.yml test job
#   Postgres + Redis services + env vars — mirror deploy.yml test job
#   exactly so PR gate semantics == post-merge deploy gate semantics
#
# Trigger: ANY change under Backend_FastAPI/** — including tests/. No
# path-filter loophole.
#
# Performance budget: ~36 phút (đo thật 04-08-2026), KHÔNG phải <10 phút.
#
# Con số <10 phút ghi ở đây từ 2026-05-24 đã lạc hậu từ lâu: các tier lớn
# dần theo từng đợt bổ sung, và tới 04-08 một lượt nối đuôi mất 70m12s.
# Sau khi tách sáu lát chạy song song, wall-clock bằng lát dài nhất.
#
# ⚠️ Đừng tin con số dự đoán — Tier 2 đo được 1731 giây (28m51) ở một lượt,
# rồi 2164 giây (36m04) ở lượt ngay sau đó, CÙNG một tập test. Runner dùng
# chung của GitHub dao động mạnh, nên coi ~36 phút là mốc thực tế và đừng
# ngạc nhiên khi thấy 29 hay 40.
#
# Wall-clock đo được của lượt song song đầu tiên: 36m13s (12:49:45 →
# 13:25:58), so với 70m12s của lần nối đuôi gần nhất. Lưu ý phép so này
# KHÔNG hoàn toàn công bằng: hai lượt chạy trên runner khác nhau, và nếu
# lượt nối đuôi rơi vào runner chậm như lượt này thì nó đã lâu hơn 70 phút.
#
# 🔴 Muốn kéo xuống nữa thì phải chẻ chính Tier 2, không phải thêm shard
# cho các lát vốn đã nhanh. Tier 2b tốn 1m44s trong đó phần lớn là dựng
# máy (test chỉ ~40 giây) — chẻ nhỏ nữa thì overhead setup nuốt hết phần
# tiết kiệm.
#
# DESIGN — BOUNDED RISK GATE (PR-1.6, 2026-05-24):
# This is a SOLO-DEV velocity-optimized PR gate. It is intentionally
# scoped to system-breaking risk paths, NOT 100% pytest coverage. The
# full backend suite lives in ``nightly-backend-pytest.yml`` (schedule +
# workflow_dispatch) — required for pre-release runs, NOT required as
# a per-PR gate. Memory ``ci-pytest-selective-allowlist-pattern`` +
# ``solo-dev-batch-prs-to-reduce-ci-overhead``: per-PR CI overhead at
# 30-60 phút × N PR-a-week is the actual cost driver for a solo dev;
# a bounded curated gate that catches release-blockers quickly is the
# right trade-off vs an exhaustive full suite per PR.
# (Mốc "<10 phút" viết ở đây năm 2026-05 nay không còn đúng — xem khối
# Performance budget bên trên. Lập luận thì vẫn nguyên: cổng có phạm vi
# giới hạn, không chạy toàn bộ tests/.)
#
# Per-test ``--timeout=60`` (pytest-timeout, added in prior commit)
# guards each tier against a future regression that re-introduces a
# hang — aborts the offending test cleanly, captures the rest of the
# tier's signal, never times out the whole GitHub Actions job.
#
# Tier composition (curated for release-blocker coverage):
#
#   Tier 1: Phase 3 multi-NV core (choice schema, state machine, engine,
#           CRUD, magic-link consume) — Wave A/B acceptance gates
#   Tier 2: RBAC + CCCD lock + CSRF (Casbin matrix, confirm lock ladder,
#           CSRF exempt prefix, XFF helper) — EXPANDED 2026-05-24 to
#           include permission_matrix + lead static-route collision +
#           fee auth + diamond inheritance because PR #329 reconciled
#           those risk surfaces and the gate must verify them on every
#           PR going forward.
#   Tier 3: Notification reliability (parity + dispatcher + bundle +
#           outbox + event coverage)
#   Tier 4: Admission + lead workflow contract (state machine, milestone
#           events, lead assignment lifecycle)
#   Tier 5: Phase 2 engine prereqs (3-tier resolution, quota chain,
#           snapshot, UNIQUE constraints)
#
# What this gate does NOT cover (intentional — moved to nightly):
#   - Full backend tests/ (~1500+ tests, broad service/repo unit sweeps)
#   - Playwright E2E
#   - Heavy historical regression suites
#   - debug-only modules (tests/integration/test_debug*.py)
#   - Zalo external-dep tests
#
# When a new release-blocker test surface lands, ADD it to the right
# tier here (not a separate workflow) so the per-PR gate stays the
# canonical risk truth.

on:
  pull_request:
    # Skip draft PRs (mirror frontend-test.yml R15 pattern) to save
    # Actions minutes during hot iteration.
    types: [opened, synchronize, reopened, ready_for_review]
    # Path filter must catch every PR type that branch-protection
    # requires `pytest` to pass on — otherwise the gate reports
    # "expected, not run" and the PR is unmergeable. Coverage:
    #   - Backend_FastAPI/**  → BE source / tests / deps / migrations
    #   - .github/workflows/**→ workflow / deploy mechanics (defensive:
    #                            workflow refactors can break CI/CD)
    #   - frontend/**         → FE may consume BE contract; full pytest
    #                            re-verifies BE didn't drift even on
    #                            FE-only PRs (cheap with pip cache)
    paths:
      - 'Backend_FastAPI/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - 'scripts/**'

concurrency:
  group: be-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================================
  # SHARD — mỗi tier một runner, chạy SONG SONG
  # =======================================================================
  # Trước 04-08 sáu lát này chạy nối đuôi trong MỘT job. Đo từ run của PR
  # #533 (giây): 1330 + 1731 + 40 + 139 + 2 + 807 + 163 = 4212, tức 70m12s
  # — bảy mục vì Tier 3 kéo theo script kiểm notification (2 giây).
  #   Tier 1  1330s (22m10)     Tier 3   139s (2m19)
  #   Tier 2  1731s (28m51)     script     2s
  #   Tier 2b   40s             Tier 4   807s (13m27)
  #                             Tier 5   163s (2m43)
  # Chúng độc lập nhau (không lát nào đọc kết quả của lát khác), nên nối
  # đuôi chỉ là quán tính. Tách ra matrix thì wall-clock rút về lát dài
  # nhất — Tier 2.
  #
  # Đo thật lượt song song đầu tiên (04-08): Tier 1 24m47 · Tier 2 36m04 ·
  # Tier 2b 1m44 · Tier 3 3m33 · Tier 4 13m14 · Tier 5 3m58 · job gom 3s.
  # Wall-clock 36m13s. Mỗi lát chậm hơn số nối đuôi khoảng 1-1,5 phút vì
  # nay phải tự checkout + `pip install` — bản nối đuôi chỉ trả một lần.
  #
  # Vì sao đáng làm: ruleset của main bật strict_required_status_checks,
  # nên mỗi lần main nhích là MỌI PR đang mở phải chạy lại từ đầu. Riêng
  # PR #533 đã chạy ba lượt trong một ngày (~3,5 giờ). 42 phút tiết kiệm
  # mỗi lượt được nhân lên theo số lần chạy lại, không phải một lần.
  #
  # Giá phải trả: 6 runner cùng `pip install` thay vì 1 (~+10-15 phút
  # Actions minutes mỗi lượt). Đổi thời gian chờ lấy compute — với solo
  # dev thì thời gian chờ đắt hơn.
  #
  # ⚠️ `fail-fast: false` là CỐ Ý. Mặc định của GitHub là huỷ mọi shard
  # còn lại ngay khi một shard đỏ — nghĩa là mỗi lượt chỉ biết được MỘT
  # tier hỏng, sửa xong lại chờ nguyên lượt nữa để lộ tier kế tiếp. Với
  # gate ~36 phút thì đó là cách nhanh nhất để đốt cả buổi.
  pytest-shard:
    name: pytest shard — ${{ matrix.tier }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------------------------------------------------------
          # Tier 1: Phase 3 multi-NV core — Wave A/B acceptance gates
          # ---------------------------------------------------------------
          # Bốn lớp `TestRefund*` canh đường TIỀN RA khỏi két, canh những thứ
          # chỉ lộ ra khi đã mất tiền hoặc đã kẹt hồ sơ:
          #   * TestRefundService — chốt số tiền lúc CHI (phiếu thu bị điều
          #     chỉnh giảm sau khi duyệt thì không được chi theo số cũ);
          #   * TestRefundNoDeadEnd — phiếu quá số bị chặn ở DUYỆT chứ không
          #     ở chi, và phiếu đã duyệt vẫn từ chối được; thiếu hai lối này
          #     thì phiếu kẹt vĩnh viễn, chỉ SQL mới gỡ (đã xảy ra thật trên
          #     prod 29-07);
          #   * TestRefundReferenceAndContext — mã tham chiếu tự điền theo
          #     ngày VN, và response mang đủ ngữ cảnh để kế toán quyết;
          #   * TestRefundSummaryIdor — dải tổng quan không đếm phiếu của
          #     đơn vị khác.
          # `test_lead_import.py` vào đây vì nó KHOÁ HÀNH VI của đường nhập
          # lead từ file — và nó vừa vỡ thật khi ô trống bị ép thành chuỗi
          # "nan". Trước đó nó chỉ chạy nightly, tức cổng PR xanh còn lỗi rơi
          # xuống sau khi merge. Hai tệp `test_lead_import_empty_*` canh chính
          # bản vá đó. Ba tệp thêm 02-08 canh những lỗ mà bản vá trên để lọt:
          #   * test_lead_import_phone_separators — SĐT toàn dấu phân cách lọt
          #     cả validator lẫn hai lớp chống trùng rồi đâm unique index, kéo
          #     đổ CẢ LÔ;
          #   * test_lead_schema_phone_and_limits — tầng schema (đường POST
          #     /api/leads đi thẳng vào đây, không qua bước strip của service);
          #   * test_lead_import_row_number_offset — số dòng báo cho người dùng
          #     phải khớp dòng trong tệp họ mở, sau khi phần đầu `#` bị cắt;
          #   * test_lead_import_error_leak — chi tiết lỗi hạ tầng (SQL + tham
          #     số) không được đi ra tới thông báo trên màn hình;
          #   * test_qa_wave9_lead_import_and_w8a32 — PR có SỬA tệp này.
          # 🔴 Thêm tệp test nhập-lead mới thì PHẢI thêm vào đây — allowlist là
          # hàng thủ công, và chính chỗ này là lý do lô lỗi trên lọt cổng PR.
          # Chọn theo LỚP chứ không cả file: các lớp payment còn lại (record/
          # overpayment) tốn thêm vài phút mà không canh đường tiền-ra.
          # `TestVerifyPayment` + `TestRejectPayment` + `test_payment_lock_order`
          # thêm 04-08 vì đường XÁC MINH cũng là đường tiền, chỉ là tiền VÀO:
          #   * trước bản vá khoá-phiếu-trước, hai lượt duyệt song song cùng
          #     đọc 'pending' rồi cùng cộng tiền — sổ ghi gấp đôi mà không ai
          #     bấm gì lạ;
          #   * `test_payment_lock_order.py` canh cả kết quả (đúng một lượt
          #     thắng) LẪN thứ tự lấy khoá (payment trước invoice trước fee) —
          #     thiếu vế thứ hai thì ai đó đảo lại thứ tự vẫn xanh.
          # `test_payments_list_filter.py` thêm 05-08: nó là hợp đồng của bộ
          # lọc nuôi ô "đang chờ duyệt" ở form ghi tiền — thứ sinh ra để chặn
          # nhập trùng, nên nó sai thì màn hình lại nói dối đúng kiểu cũ. Bốn
          # mặt nó khoá, mỗi mặt đã đỏ được ít nhất một lần khi gỡ guard:
          #   * phạm vi theo KHOẢN PHÍ (mọi đợt), không phải một hoá đơn;
          #   * IDOR — `fee_id` là số đoán được, đơn vị khác hỏi phải ra rỗng;
          #   * `pending_manual_only` AND `fee_id` — hàng đợi maker-checker
          #     không được lẫn phiếu ONLINE đang treo, và không được bỏ qua
          #     `fee_id` rồi trả cả hàng đợi trong phạm vi quyền;
          #   * biên int32 — `fee_id` quá lớn phải là 422, không phải 500 do
          #     asyncpg "value out of int32 range".
          # Ba tệp B2 (hàng rào chống GHI TRÙNG phiếu thu) thêm 05-08. Cùng một
          # đường tiền vào, nhưng canh ba mặt khác nhau — bỏ tệp nào thì mặt đó
          # không còn ai canh trên PR:
          #   * test_payment_amount_precision — `100.001` né được phép so khớp
          #     rồi vẫn bị Numeric(15,2) làm tròn thành `100.00`; tức hàng rào
          #     chống trùng có thể bị đi vòng bằng cách gõ thêm một chữ số;
          #   * test_payment_duplicate_guard — luật dò (phạm vi KHOẢN PHÍ, số
          #     tiền bằng nhau, ±3 NGÀY LỊCH VN, loại phiếu đã hoàn ĐỦ), thứ tự
          #     khoá invoice→fee→quét→ghi, và ca ĐỒNG THỜI hai hoá đơn cùng một
          #     khoản phí. Ca đồng thời cần PostgreSQL thật nên chỉ sống ở đây;
          #   * test_payment_duplicate_contract — thân JSON của lỗi 409 (không
          #     đi qua `response_model` nào cả, nên không ai rà hộ): đúng tập
          #     khoá, số tiền là chuỗi, ngày ISO, tối đa 20 phần tử, không rò
          #     `context`, và 409 không được sinh thêm phiếu;
          #   * test_payment_import_service — ĐƯỜNG NHẬP LÔ, nơi 286 phiếu prod
          #     đi vào. Canh hai thứ không đường nào khác canh hộ: bản BÓ của
          #     luật dò trùng phải cho cùng kết quả với bản một-phiếu (chép lệch
          #     là có hai hàng rào, và bản lỏng hơn thắng), và hàng rào ở bước
          #     ghi phải bỏ ĐÚNG dòng nghi trùng chứ không bỏ cả lô — cũng không
          #     được tự tố phiếu mà chính lô này vừa ghi.
          # Ba tập cuối (cohort đưa sang hệ ký túc xá) canh thứ hỏng ÂM THẦM:
          #   * test_hk1_fee_scope_single_source — structural lock-in buộc các
          #     call site thật sự gọi helper chung;
          #   * test_dorm_export_cohort — cohort bám đúng năm học được hỏi;
          #   * test_dorm_sync_* + test_sync_dorm_students_cli — chặn
          #     --batch-size <= 0 (thứ từng khiến một lượt đồng bộ ghi 0 hồ sơ
          #     rồi vẫn báo thành công), cùng toàn bộ lõi đồng bộ ký túc xá:
          #     cấu hình fail-closed, ảnh chụp nguồn, phiếu ký, ba pha ghi, và
          #     sổ cái chống ghi lặp.
          #
          # 🔴 `test_sync_dorm_students.py` KHÔNG còn tồn tại — Gate 2 tách nó
          # thành lõi (`test_dorm_sync_service.py`) và vỏ CLI
          # (`test_sync_dorm_students_cli.py`). Để nguyên đường dẫn cũ ở đây là
          # `ERROR: file or directory not found` và **exit 4**: cả lát đỏ trước
          # khi chạy được ca nào, nên không có gì trong danh sách này được kiểm.
          # Đường dẫn literal trong workflow không ai đổi tên hộ — mỗi lần đổi
          # tên tệp test phải rà lại đúng chỗ này.
          #
          # ⚠️ Hai tệp INTEGRATION của nhóm này nằm ở Tier 5, không ở đây. Đo
          # thật: 10 tệp unit hết 10 giây, còn 2 tệp integration hết 3m46 (chúng
          # dựng schema thật và có một ca đua chờ khoá PostgreSQL). Tier 1 đang
          # là lát dài gần nhất với Tier 2, nên cộng thêm 4 phút vào đây là đẩy
          # thẳng wall-clock của cả gate lên; Tier 5 mới 2m43 nên nó chịu phần
          # đó mà không ai phải chờ lâu hơn.
          #
          # ⚠️ TUYỆT ĐỐI không đặt comment BÊN TRONG `tests: >-`. YAML gấp
          # folded scalar thành MỘT dòng, nên dấu `#` đầu tiên biến toàn bộ
          # phần còn lại thành comment của shell — nuốt cả danh sách test lẫn
          # `--timeout=60`, và workflow vẫn xanh vì lệnh vẫn chạy (chạy thiếu).
          - tier: Tier 1 — Phase 3 multi-NV core
            tests: >-
              tests/unit/test_phase3_pr3a_choice_and_score.py
              tests/unit/test_phase3_pr3b_state_machine.py
              tests/unit/test_phase3_pr3c_sub1_scoring_gates.py
              tests/unit/test_phase3_pr3c_sub2_choice_engine.py
              tests/unit/test_phase3_pr3c_sub2b_router_helpers.py
              tests/unit/test_phase3_pr3c_sub3_router_registration.py
              tests/api/test_phase3_pr3c_routers_integration.py
              tests/integration/test_choice_engine_quota_concurrent.py
              tests/api/test_phase3_pr3d_b_choice_crud.py
              tests/api/test_phase3_pr3d_b_admin_backfill.py
              tests/api/test_phase3_pr3e_magic_link.py
              tests/api/test_magic_link_3_actions_wire.py
              tests/services/test_phase3_create_profile_inherits_multi_nv.py
              tests/unit/test_admission_path_service_field_drift.py
              tests/integration/test_admission_path_method_filter_and_activator.py
              tests/unit/test_delete_profile_file_cleanup.py
              tests/unit/test_enrollment_letter_pdf.py
              tests/unit/test_enrollment_letter_cleanup.py
              tests/unit/test_hk1_fee_scope_single_source.py
              tests/repositories/test_dorm_export_cohort.py
              tests/unit/test_sync_dorm_students_cli.py
              tests/unit/test_dorm_sync_config.py
              tests/unit/test_dorm_sync_context.py
              tests/unit/test_dorm_sync_service.py
              tests/unit/test_dorm_sync_snapshot.py
              tests/unit/test_dorm_sync_preview_service.py
              tests/unit/test_dorm_sync_apply_service.py
              tests/unit/test_dorm_sync_apply_router.py
              tests/unit/test_dorm_sync_warning_passthrough.py
              tests/unit/test_dorm_sync_operation_model.py
              tests/services/test_payment_service.py::TestRefundService
              tests/services/test_payment_service.py::TestRefundNoDeadEnd
              tests/api/test_lead_import.py
              tests/api/test_lead_import_error_leak.py
              tests/api/test_lead_import_phone_separators.py
              tests/api/test_lead_import_row_number_offset.py
              tests/api/test_qa_wave9_lead_import_and_w8a32.py
              tests/unit/test_lead_import_empty_cells.py
              tests/unit/test_lead_import_empty_email_end_to_end.py
              tests/unit/test_lead_schema_phone_and_limits.py
              tests/services/test_payment_service.py::TestRefundReferenceAndContext
              tests/services/test_payment_service.py::TestRefundSummaryIdor
              tests/services/test_payment_service.py::TestVerifyPayment
              tests/services/test_payment_service.py::TestRejectPayment
              tests/services/test_payment_lock_order.py
              tests/api/test_payments_list_filter.py
              tests/unit/test_payment_amount_precision.py
              tests/services/test_payment_duplicate_guard.py
              tests/api/test_payment_duplicate_contract.py
              tests/services/test_payment_import_service.py

          # ---------------------------------------------------------------
          # Tier 2: RBAC + CCCD lock + CSRF
          # ---------------------------------------------------------------
          # EXPANDED 2026-05-24 để gồm permission_matrix + lead static-route
