    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/qlts_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      JWT_SECRET_KEY: test-jwt-secret-for-ci-only
      # Pepper cho selector backup code MFA. tests/conftest.py cũng gán giá
      # trị test, nhưng để ở đây thì một lát chạy KHÔNG qua conftest gốc
      # vẫn có pepper thay vì fail closed vì lý do môi trường.
      MFA_BACKUP_CODE_PEPPER: ci-only-backup-code-pepper-not-a-secret
      # Mail settings — placeholders so app/config.py Settings() can instantiate.
      # Tests must not actually send mail; smtp.example.com is unroutable on purpose.
      MAIL_USERNAME: ci-test@example.com
      MAIL_PASSWORD: ci-test-placeholder
      MAIL_FROM: ci-test@example.com
      MAIL_SERVER: smtp.example.com

    # Mỗi shard là một job riêng nên GitHub dựng CẶP Postgres+Redis RIÊNG cho
    # từng shard. Đây là điều kiện bắt buộc, không phải tối ưu: các lát này
    # DROP/CREATE schema `qlts_test` và TRUNCATE toàn bộ bảng giữa các test —
    # dùng chung một DB thì chúng xoá dữ liệu của nhau giữa chừng.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qlts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend_FastAPI/requirements-dev.txt

      - name: Install backend dependencies (dev)
        working-directory: Backend_FastAPI
        run: pip install -r requirements-dev.txt

      - name: pytest — ${{ matrix.tier }}
        working-directory: Backend_FastAPI
        run: python -m pytest ${{ matrix.tests }} -q --tb=short --timeout=60

      - name: Notification event coverage script
        if: matrix.coverage_script
        working-directory: Backend_FastAPI
        run: python -m app.scripts.check_notification_event_coverage

      # Cổng ĐỘ NHÌN THẤY của test — xem docstring của script để biết vì sao.
      #
      # Đặt SAU bước cài phụ thuộc (cần PyYAML) và trước khi job kết thúc, nằm
      # trong shard nên `pytest` tổng hợp đã bắt được lỗi đỏ — không cần thêm
      # required check nào.
      #
      # KHÔNG dùng `fetch-depth: 0` ở `actions/checkout`: bước checkout là bước
      # CHUNG của cả sáu leg matrix, nên bật full history ở đó bắt sáu runner
      # tải toàn bộ lịch sử và tags. Ở đây chỉ cần đúng một commit base.
      #
      # `github.sha` trên sự kiện `pull_request` là commit MERGE tổng hợp — đúng
      # cây sẽ được áp lên base — nên phép so là `git diff BASE MERGE`, hai cây,
      # không cần merge-base và không cần lịch sử.
      - name: CI test-visibility guard
        if: matrix.visibility_guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python .github/scripts/pytest_visibility_guard.py

  # =======================================================================
  # Cổng SỐNG SÓT PHIÊN — collected == executed
  # =======================================================================
  # Bất biến "mọi node thu thập được đều THỰC THI" không cổng nào khác canh:
  # cổng độ phủ của nightly chỉ chứng minh node đã được PHÂN LÁT. shard-06 của
  # run 32513696715 phân lát 744 node, thực thi 737 — bảy test không bao giờ
  # chạy mà cổng vẫn xanh.
  #
  # Chạy như một JOB RIÊNG chứ không phải một node pytest: tiến trình cha phải
  # nhẹ. Khi nó nằm trong bộ test, cha là pytest đang giữ cả app và cha + con
  # vượt trần bộ nhớ — đo tại máy: `OSError: [Errno 12] Cannot allocate memory`
  # ở 1/5 rồi 2/4 lượt. Ở đây cha chỉ là một script Python trần.
  session-survival:
    name: session survival — collected == executed
    runs-on: ubuntu-latest
    # Job required PHẢI có trần thời gian. Không có nó thì một lượt collect hay
    # import bị treo sẽ giữ required check tới trần mặc định của Actions (6 giờ)
    # — cổng không đỏ, không xanh, chỉ đứng đó.
    #
    # ⚠️ Ngân sách phải CÓ BIÊN, nếu không thì ba lớp trần mất thứ tự. Bản trước
    # đặt job 600s trong khi hai subprocess tuần tự đã là 180 + 420 = 600s: nếu
    # collect gần chạm trần rồi lượt chạy treo, Actions giết job TRƯỚC khi script
    # kịp bắt `TimeoutExpired` và trả mã 3 — mất đúng phần phân biệt "không đo
    # được" với "lệch".
    #
    #   setup (checkout + python + pip, có cache)   ~<= 180s
    #   collect  (TRAN_THU_THAP trong kiem-phien.py)  120s
    #   chạy     (TRAN_CHAY)                          300s
    #   ------------------------------------------------
    #   xấu nhất                                      600s   <   900s
    #
    # Đổi một trong ba số thì phải đổi cả `tests-e2e/session-survival/`
    # (hằng số trong script + bảng trong README).
    timeout-minutes: 15

    # Job ĐỘC LẬP nên KHÔNG kế thừa env của `pytest-shard`. Thiếu khối này thì
    # `app/config.py` Settings() ném ngay lúc collect và job chết TRƯỚC khi đo
    # được điều nó sinh ra để đo. Không dựng Postgres/Redis: tệp mục tiêu chạy
    # với `--noconftest` và không kết nối chúng — DSN ở đây chỉ để Settings()
    # dựng được.
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/qlts_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      JWT_SECRET_KEY: test-jwt-secret-for-ci-only
      # Pepper cho selector backup code MFA. tests/conftest.py cũng gán giá
      # trị test, nhưng để ở đây thì một lát chạy KHÔNG qua conftest gốc
      # vẫn có pepper thay vì fail closed vì lý do môi trường.
      MFA_BACKUP_CODE_PEPPER: ci-only-backup-code-pepper-not-a-secret
      MAIL_USERNAME: ci-test@example.com
      MAIL_PASSWORD: ci-test-placeholder
      MAIL_FROM: ci-test@example.com
      MAIL_SERVER: smtp.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend_FastAPI/requirements-dev.txt

      - name: Install backend dependencies (dev)
        working-directory: Backend_FastAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Mã thoát 3 = KHÔNG ĐO ĐƯỢC (tiến trình con bị giết, không thu thập
      # được node…). Nó KHÁC 1 = lệch, và cả hai đều làm job đỏ — không đo
      # được thì báo, không suy ra là đạt.
      - name: Phiên pytest phải chạy đủ node và kết thúc bình thường
        working-directory: Backend_FastAPI
        run: |
          python ../tests-e2e/session-survival/kiem-phien.py             tests/utils/test_file_helpers.py test_khong_ro_ri_stdlib

  # =======================================================================
  # GATE — required status check, tên phải giữ NGUYÊN là `pytest`
  # =======================================================================
  # Ruleset 16381130 đòi đúng chuỗi `pytest`. Job này gom kết quả của mọi
  # shard lại dưới đúng cái tên đó, nên KHÔNG phải sửa ruleset — và cũng
  # không phải sửa lại mỗi lần thêm/bớt một shard.
  #
  # 🔴 `if: always()` là con dao hai lưỡi. Không có nó thì job bị skip khi
  # một shard đỏ, mà check bị skip KHÔNG làm PR đỏ — cổng biến mất đúng lúc
  # cần nó nhất. Có nó thì job luôn chạy, nên thân job BẮT BUỘC phải tự kiểm
  # kết quả; nếu chỉ `echo "ok"` thì cổng xanh vĩnh viễn kể cả khi mọi shard
  # đều đỏ. Đó là lý do có bước so `needs.pytest-shard.result` bên dưới.
  #
  # Với matrix, `needs.<job>.result` là kết quả GỘP: 'success' chỉ khi TOÀN
  # BỘ shard success. Một shard đỏ ⇒ 'failure'; bị huỷ ⇒ 'cancelled'; bị bỏ
  # qua ⇒ 'skipped'. Nên điều kiện đúng là `!= 'success'`, không phải
  # `== 'failure'` — viết kiểu sau thì lượt bị huỷ giữa chừng sẽ lọt qua.
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    needs: [pytest-shard, session-survival]
    if: always()
    steps:
      - name: Gom kết quả các shard
        run: |
          RESULT="${{ needs.pytest-shard.result }}"
          echo "Kết quả gộp của pytest-shard: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::Có shard pytest KHÔNG thành công (kết quả gộp: $RESULT). Mở job 'pytest shard — ...' tương ứng để xem lát nào hỏng."
            exit 1
          fi
          echo "✅ Toàn bộ shard pytest đã thành công."

      # Cổng session-survival là một job RIÊNG, nên nếu không gom vào đây thì
      # nó không thuộc required check nào và PR gate vẫn xanh khi bất biến
      # collected == executed bị phá.
      - name: Gom kết quả cổng session-survival
        run: |
          RESULT="${{ needs.session-survival.result }}"
          echo "Kết quả của session-survival: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::Cổng session-survival KHÔNG thành công (kết quả: $RESULT). Mở job 'session survival — collected == executed'."
            exit 1
          fi
          echo "✅ Cổng session-survival đã thành công."
