          # ---------------------------------------------------------------
          # EXPANDED 2026-05-24 để gồm permission_matrix + lead static-route
          # collision + fee auth + diamond inheritance, vì PR #329 đã dàn xếp
          # lại những mặt rủi ro đó và cổng phải kiểm chúng trên MỌI PR.
          # `test_mfa_reservation_real_redis.py` và
          # `test_mfa_single_use_atomic_real_redis.py` PHẢI nằm ở shard có
          # service `redis:7-alpine` (shard này có) — cả hai cố ý bỏ qua
          # FakeRedis và nối thẳng tới server thật bằng callable gốc đã lưu
          # trước lúc patch. Không tới được Redis thì chúng ĐỎ, không skip:
          # "không đo được" không phải là "đạt".
          #
          # Cặp `*_single_use_atomic*` canh TIÊU-THỤ-MỘT-LẦN của hai bằng chứng
          # MFA: một time step TOTP (`totp_used:{uid}`) và một `mfa_token`
          # (`mfa_used:{jti}`). Bản trước của cả hai đều là đọc-rồi-ghi KHÔNG
          # nguyên tử và fail OPEN khi Redis lỗi. Lát unit chạy FakeRedis nên
          # KHÔNG chứng minh được tính nguyên tử — chỉ lát real-redis làm được,
          # và nó phải ở đúng shard này.
          #
          # `test_mfa_race_reproducer.py` là tệp RIÊNG và cố ý KHÔNG import
          # symbol nào mới, nên nó chạy được cả trên commit TRƯỚC bản vá — nơi
          # nó đỏ với `2/2 request cùng được chấp nhận cho MỘT mã TOTP` và
          # `_complete_login_flow chạy 2 lần`. Hai tệp `*_single_use_atomic*`
          # KHÔNG có tính chất đó (chúng import `KetQuaChiem`/`safe_redis_*`
          # mới); đừng trích chúng khi cần bằng chứng "đỏ trước khi vá".
          # Các dòng MFA cuối danh sách canh chi phí bcrypt của đường backup
          # code (DoS availability): số phép bcrypt theo hình dạng mã, trần
          # đồng thời, fail-closed khi Redis chết, và tiêu-thụ-một-lần khi hai
          # request đua nhau.
          #
          # Năm dòng cuối là NODEID chứ không phải cả tệp: `test_mfa.py` chạy
          # trọn mất ~10,5 phút (76 ca, phần lớn là băm mật khẩu bcrypt
          # rounds=15 của fixture), quá đắt cho một shard per-PR.
          #
          # 🔴 Tám ca từng TIMEOUT ở nightly nằm rải trong NĂM lớp, không phải
          # hai. Bản trước chọn hai lớp và ghi rằng đó "chính là tám ca ấy" —
          # sai, và sai theo kiểu nguy hiểm nhất: hai lớp đó cộng lại vừa đúng
          # tám test, nên con số khớp trong khi phạm vi phủ chỉ là 5/8. Ba
          # nodeid còn lại được liệt kê TƯỜNG MINH bên dưới; thiếu chúng thì
          # ba luồng ấy hồi quy mà required check vẫn xanh.
          # `test_activity_log_contract.py` ở cuối lát này canh giao ước
          # `activity_service.log_activity() -> UserActivityLog`. Nó thuộc Tier 2
          # vì mọi đường nó đi qua đều là endpoint quản trị (roles/policies,
          # admin users) — cùng bề mặt RBAC mà lát này đã gác.
          #
          # ⚠️ Chú thích PHẢI nằm ngoài scalar `tests: >-`. Bên trong, YAML coi
          # `#` là nội dung, `>-` gấp mọi dòng thành MỘT dòng, rồi bash cắt từ
          # `#` tới hết — đo được 17 đối số thay vì 25 ở một lần trước.
          # test_casbin_thu_hoi_quyen.py vao Tier 2, dung canh test_permissions_matrix:
          # ca hai canh cung mat A01 Broken Access Control. Tep nay khoa bat bien THU
          # HOI quyen — moi duong xoa phai dung DU bon truong (p = sub, obj, act, eft),
          # va xoa `allow` phai GIU `deny` cung (sub,obj,act). Khong dat o lat nhe hon:
          # no phai chay cung luot voi bo khoa RBAC, vi hai ben cung noi ve mot mo hinh.
