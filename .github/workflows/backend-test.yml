name: Backend Test (PR Gate)

# Touched 2026-05-14 alongside PR #288 (.gitignore cleanup) AND PR #289
# (Documents/scripts inventory batch) only to trigger this gate —
# branch protection ruleset 16381130 requires ``pytest`` on every PR,
# but root-level / Documents/ only PRs do not match any path filter
# below and would otherwise sit at "expected, not run" forever.
# ``scripts/**`` WAS ADDED to the path filter (2026-07-02, PR #459) so
# deploy/ops-script PRs trigger the gate (surfaced when a deploy.sh-only
# fix stuck at "expected, not run"). Future Documents/root-only PRs:
# bundle a no-op workflow touch like this OR expand the path filter
# below explicitly (trade-off: gate runs on every such change).
#
# Sprint S2 hardening (memory `auto-merge-requires-full-ci-not-just-green`):
# Closes the systemic gap surfaced by PR #283 orphan-merge. The existing
# admission-contract-check.yml has a path filter (`services/admission*.py`,
# `core/events*.py`, ...) that DOES NOT include `Backend_FastAPI/tests/**`.
# Result: a test-only PR (e.g., #283 PR-CO-4) could auto-merge with only
# Dependency Audit running — the actual pytest suite that the PR modified
# never ran in CI. The M1 fix shipped post-merge as an orphan commit
# (PR #284 cherry-pick repair). This workflow eliminates that gap.
#
# Cross-file sync (memory `ci-workflow-flag-cross-file-sync`):
#   python-version '3.12'   — matches deploy.yml + dependency-audit.yml
#   cache: 'pip'            — matches deploy.yml
#   cache-dependency-path   — matches deploy.yml test job
#   Postgres + Redis services + env vars — mirror deploy.yml test job
#   exactly so PR gate semantics == post-merge deploy gate semantics
#
# Trigger: ANY change under Backend_FastAPI/** — including tests/. No
# path-filter loophole.
#
# Performance budget: <10 phút median.
#
# DESIGN — BOUNDED RISK GATE (PR-1.6, 2026-05-24):
# This is a SOLO-DEV velocity-optimized PR gate. It is intentionally
# scoped to system-breaking risk paths, NOT 100% pytest coverage. The
# full backend suite lives in ``nightly-backend-pytest.yml`` (schedule +
# workflow_dispatch) — required for pre-release runs, NOT required as
# a per-PR gate. Memory ``ci-pytest-selective-allowlist-pattern`` +
# ``solo-dev-batch-prs-to-reduce-ci-overhead``: per-PR CI overhead at
# 30-60 phút × N PR-a-week is the actual cost driver for a solo dev;
# a bounded curated gate that catches release-blockers in <10 phút is
# the right trade-off vs an exhaustive 25-30 phút full suite per PR.
#
# Per-test ``--timeout=60`` (pytest-timeout, added in prior commit)
# guards each tier against a future regression that re-introduces a
# hang — aborts the offending test cleanly, captures the rest of the
# tier's signal, never times out the whole GitHub Actions job.
#
# Tier composition (curated for release-blocker coverage):
#
#   Tier 1: Phase 3 multi-NV core (choice schema, state machine, engine,
#           CRUD, magic-link consume) — Wave A/B acceptance gates
#   Tier 2: RBAC + CCCD lock + CSRF (Casbin matrix, confirm lock ladder,
#           CSRF exempt prefix, XFF helper) — EXPANDED 2026-05-24 to
#           include permission_matrix + lead static-route collision +
#           fee auth + diamond inheritance because PR #329 reconciled
#           those risk surfaces and the gate must verify them on every
#           PR going forward.
#   Tier 3: Notification reliability (parity + dispatcher + bundle +
#           outbox + event coverage)
#   Tier 4: Admission + lead workflow contract (state machine, milestone
#           events, lead assignment lifecycle)
#   Tier 5: Phase 2 engine prereqs (3-tier resolution, quota chain,
#           snapshot, UNIQUE constraints)
#
# What this gate does NOT cover (intentional — moved to nightly):
#   - Full backend tests/ (~1500+ tests, broad service/repo unit sweeps)
#   - Playwright E2E
#   - Heavy historical regression suites
#   - debug-only modules (tests/integration/test_debug*.py)
#   - Zalo external-dep tests
#
# When a new release-blocker test surface lands, ADD it to the right
# tier here (not a separate workflow) so the per-PR gate stays the
# canonical risk truth.

on:
  pull_request:
    # Skip draft PRs (mirror frontend-test.yml R15 pattern) to save
    # Actions minutes during hot iteration.
    types: [opened, synchronize, reopened, ready_for_review]
    # Path filter must catch every PR type that branch-protection
    # requires `pytest` to pass on — otherwise the gate reports
    # "expected, not run" and the PR is unmergeable. Coverage:
    #   - Backend_FastAPI/**  → BE source / tests / deps / migrations
    #   - .github/workflows/**→ workflow / deploy mechanics (defensive:
    #                            workflow refactors can break CI/CD)
    #   - frontend/**         → FE may consume BE contract; full pytest
    #                            re-verifies BE didn't drift even on
    #                            FE-only PRs (cheap with pip cache)
    paths:
      - 'Backend_FastAPI/**'
      - 'frontend/**'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - 'scripts/**'

concurrency:
  group: be-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/qlts_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      JWT_SECRET_KEY: test-jwt-secret-for-ci-only
      # Mail settings — placeholders so app/config.py Settings() can instantiate.
      # Tests must not actually send mail; smtp.example.com is unroutable on purpose.
      MAIL_USERNAME: ci-test@example.com
      MAIL_PASSWORD: ci-test-placeholder
      MAIL_FROM: ci-test@example.com
      MAIL_SERVER: smtp.example.com

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qlts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend_FastAPI/requirements-dev.txt

      - name: Install backend dependencies (dev)
        working-directory: Backend_FastAPI
        run: pip install -r requirements-dev.txt

      # =====================================================================
      # Tier 1: Phase 3 multi-NV core — Wave A/B acceptance gates
      # =====================================================================
      # Bốn lớp `TestRefund*` canh đường TIỀN RA khỏi két, canh những thứ chỉ lộ ra
      # khi đã mất tiền hoặc đã kẹt hồ sơ:
      #   * TestRefundService — chốt số tiền lúc CHI (phiếu thu bị điều chỉnh giảm
      #     sau khi duyệt thì không được chi theo số cũ);
      #   * TestRefundNoDeadEnd — phiếu quá số bị chặn ở DUYỆT chứ không ở chi, và
      #     phiếu đã duyệt vẫn từ chối được; thiếu hai lối này thì phiếu kẹt vĩnh
      #     viễn, chỉ SQL mới gỡ (đã xảy ra thật trên prod 29-07);
      #   * TestRefundReferenceAndContext — mã tham chiếu tự điền theo ngày VN,
      #     và response mang đủ ngữ cảnh để kế toán quyết trên bảng;
      #   * TestRefundSummaryIdor — dải tổng quan không đếm phiếu của đơn vị khác.
      # `test_lead_import.py` vào đây vì nó KHOÁ HÀNH VI của đường nhập lead từ
      # file — và nó vừa vỡ thật khi ô trống thôi bị ép thành chuỗi "nan". Trước
      # đó nó chỉ chạy nightly, tức cổng PR xanh còn lỗi rơi xuống sau khi merge.
      # Hai tệp `test_lead_import_empty_*` canh chính bản vá đó.
      # Ba tệp thêm 02-08 canh những lỗ mà chính bản vá trên để lọt:
      #   * test_lead_import_phone_separators — SĐT toàn dấu phân cách lọt cả
      #     validator lẫn hai lớp chống trùng rồi đâm unique index, kéo đổ CẢ LÔ;
      #   * test_lead_schema_phone_and_limits — tầng schema (đường POST /api/leads
      #     đi thẳng vào đây, không qua bước strip của service): khoảng trắng
      #     trần, đầu vào không phải chuỗi, và độ dài phải khớp cột DB;
      #   * test_lead_import_row_number_offset — số dòng báo cho người dùng phải
      #     khớp dòng trong tệp họ mở, sau khi phần đầu `#` bị cắt;
      #   * test_lead_import_error_leak — chi tiết lỗi hạ tầng (SQL + tham số)
      #     không được đi ra tới thông báo trên màn hình;
      #   * test_qa_wave9_lead_import_and_w8a32 — PR có SỬA tệp này, nên nó phải
      #     chạy ở cổng PR chứ không chỉ nightly.
      # 🔴 Thêm tệp test nhập-lead mới thì PHẢI thêm vào đây — allowlist là hàng
      # thủ công, và chính chỗ này là lý do lô lỗi trên lọt được cổng PR.
      # Chọn theo LỚP chứ không cả file: các lớp payment còn lại (record/
      # overpayment) tốn thêm vài phút mà không canh đường tiền-ra, để nightly.
      # `TestVerifyPayment` + `TestRejectPayment` + `test_payment_lock_order.py`
      # thêm 04-08 vì đường XÁC MINH cũng là đường tiền, chỉ là tiền VÀO:
      #   * trước bản vá khoá-phiếu-trước, hai lượt duyệt song song cùng đọc
      #     'pending' rồi cùng cộng tiền — sổ ghi gấp đôi mà không ai bấm gì lạ;
      #   * `test_payment_lock_order.py` canh cả kết quả (đúng một lượt thắng)
      #     LẪN thứ tự lấy khoá (payment trước invoice trước fee) — thiếu vế
      #     thứ hai thì ai đó đảo lại thứ tự vẫn xanh, và cửa kẹt chéo với
      #     đường đảo tiền mở lại mà không phép kiểm nào kêu.
      # Hai lớp verify/reject vào cùng vì chúng là hành vi đơn luồng mà bản vá
      # đó chạm tới; để nightly thì hồi quy chỉ lộ ra sau khi đã merge.
      # Ba tập cuối (cohort đưa sang hệ ký túc xá) canh những thứ hỏng ÂM THẦM:
      #   * test_hk1_fee_scope_single_source — structural lock-in buộc các call
      #     site thật sự gọi helper chung, không chép tay lại vị từ HK1;
      #   * test_dorm_export_cohort — cohort bám đúng năm học được hỏi (mượn
      #     max(academic_year) sẽ làm hồ sơ mùa cũ biến mất);
      #   * test_sync_dorm_students — chặn --batch-size <= 0, thứ từng khiến một
      #     lượt đồng bộ ghi 0 hồ sơ rồi vẫn hạ cờ 7 người và báo thành công.
      # Không có ở đây thì chúng chỉ chạy nightly, tức là SAU khi đã merge.
      #
      # ⚠️ TUYỆT ĐỐI không đặt comment BÊN TRONG `run: >-`. YAML gấp folded
      # scalar thành MỘT dòng, nên dấu `#` đầu tiên biến toàn bộ phần còn lại
      # thành comment của shell — nuốt cả danh sách test lẫn `--timeout=60`, và
      # workflow vẫn xanh vì lệnh vẫn chạy (chỉ là chạy thiếu).
      - name: pytest — Phase 3 multi-NV core
        working-directory: Backend_FastAPI
        run: >-
          python -m pytest
          tests/unit/test_phase3_pr3a_choice_and_score.py
          tests/unit/test_phase3_pr3b_state_machine.py
          tests/unit/test_phase3_pr3c_sub1_scoring_gates.py
          tests/unit/test_phase3_pr3c_sub2_choice_engine.py
          tests/unit/test_phase3_pr3c_sub2b_router_helpers.py
          tests/unit/test_phase3_pr3c_sub3_router_registration.py
          tests/api/test_phase3_pr3c_routers_integration.py
          tests/integration/test_choice_engine_quota_concurrent.py
          tests/api/test_phase3_pr3d_b_choice_crud.py
          tests/api/test_phase3_pr3d_b_admin_backfill.py
          tests/api/test_phase3_pr3e_magic_link.py
          tests/api/test_magic_link_3_actions_wire.py
          tests/services/test_phase3_create_profile_inherits_multi_nv.py
          tests/unit/test_admission_path_service_field_drift.py
          tests/integration/test_admission_path_method_filter_and_activator.py
          tests/unit/test_delete_profile_file_cleanup.py
          tests/unit/test_enrollment_letter_pdf.py
          tests/unit/test_enrollment_letter_cleanup.py
          tests/unit/test_hk1_fee_scope_single_source.py
          tests/repositories/test_dorm_export_cohort.py
          tests/unit/test_sync_dorm_students.py
          tests/services/test_payment_service.py::TestRefundService
          tests/services/test_payment_service.py::TestRefundNoDeadEnd
          tests/api/test_lead_import.py
          tests/api/test_lead_import_error_leak.py
          tests/api/test_lead_import_phone_separators.py
          tests/api/test_lead_import_row_number_offset.py
          tests/api/test_qa_wave9_lead_import_and_w8a32.py
          tests/unit/test_lead_import_empty_cells.py
          tests/unit/test_lead_import_empty_email_end_to_end.py
          tests/unit/test_lead_schema_phone_and_limits.py
          tests/services/test_payment_service.py::TestRefundReferenceAndContext
          tests/services/test_payment_service.py::TestRefundSummaryIdor
          tests/services/test_payment_service.py::TestVerifyPayment
          tests/services/test_payment_service.py::TestRejectPayment
          tests/services/test_payment_lock_order.py
          -q --tb=short --timeout=60

      # =====================================================================
      # Tier 2: RBAC + security + CCCD lock + CSRF
      #
      # PR-1.6 (2026-05-24) — added 4 surfaces that PR #329 reconciled and
      # the prior allowlist did not execute (memory
      # ``auto-merge-requires-full-ci-not-just-green`` flagged this gap):
      #   * test_permissions_matrix.py — role/route assertion matrix
      #   * test_casbin_lead_static_route_collision.py — keyMatch4 leak guard
      #   * test_fees_calculate_authorization.py — officer scoped fee auth
      #   * test_finance_api.py::TestDiamondInheritance — allow/deny semantics
      # =====================================================================
      - name: pytest — RBAC + security + CCCD lock
        working-directory: Backend_FastAPI
        run: >-
          python -m pytest
          tests/unit/test_casbin_phase3_routes.py
          tests/integration/test_casbin_b1_4x14_matrix.py
          tests/unit/test_csrf_middleware.py
          tests/integration/test_admission_confirmation_lock_ladder.py
          tests/integration/test_admission_confirm_lock.py
          tests/unit/test_admission_state_service_event_mapping.py
          tests/unit/test_client_ip_helper.py
          tests/unit/test_admission_confirmation_cooldown.py
          tests/unit/test_magic_link_rate_limit_key_hashing.py
          tests/api/test_admin_v2_admission_round_phase3_flags.py
          tests/security/test_permissions_matrix.py
          tests/integration/test_casbin_lead_static_route_collision.py
          tests/api/test_fees_calculate_authorization.py
          tests/api/test_finance_api.py::TestDiamondInheritance
          tests/security/test_ratelimit_order_guard.py
          tests/security/test_ip_rate_limit.py
          tests/security/test_ratelimit_per_user_key.py
          tests/api/test_consultation_security.py
          tests/unit/test_casbin_enrollment_letter_routes.py
          tests/api/test_enrollment_letter_api.py
          -q --tb=short --timeout=60

      # =====================================================================
      # Tier 3: Notification reliability (legacy deploy.yml subset)
      # =====================================================================
      - name: pytest — Notification reliability
        working-directory: Backend_FastAPI
        run: >-
          python -m pytest
          tests/unit/test_notification_parity.py
          tests/services/test_notification_dispatcher.py
          tests/integration/test_notification_core_v2.py
          tests/services/test_notification_bundle.py
          tests/services/test_admission_bundle_contract.py
          tests/integration/test_condition_dispatch.py
          tests/unit/test_outbox_worker.py
          tests/unit/test_outbox_skeleton.py
          tests/unit/test_check_notification_event_coverage_deferred.py
          -q --tb=short --timeout=60

      - name: pytest — Notification event coverage script
        working-directory: Backend_FastAPI
        # Wave 3 (2026-05-19): all 3 PRIORITY_* events wired via outbox
        # → no more --allow-deferred needed. Sync với
        # admission-contract-check.yml per memory
        # `ci-workflow-flag-cross-file-sync`.
        run: |
          python -m app.scripts.check_notification_event_coverage

      # =====================================================================
      # Tier 4: Admission + lead workflow contract (legacy deploy.yml subset)
      # =====================================================================
      - name: pytest — Admission + lead workflow contract
        working-directory: Backend_FastAPI
        run: >-
          python -m pytest
          tests/api/test_admission_workflow_api.py
          tests/api/test_lead_assignment_api.py::test_lead_assignment_lifecycle_end_to_end
          tests/services/test_assignment.py
          tests/unit/test_lead_action_permissions.py
          tests/integration/test_reassign_terminal_guard.py
          tests/integration/test_delete_consultation_revert.py
          tests/integration/test_restore_consultation_revert.py
          tests/integration/test_add_restore_consultation_latest.py
          tests/integration/test_consultation_system_immutable.py
          tests/unit/test_consultation_schema_validation.py
          tests/repositories/test_consultation_system_excluded_nhom3.py
          tests/unit/test_consultation_action_permissions.py
          tests/integration/test_lead_timeline_permissions.py
          tests/services/test_assignment_self_sourced.py
          tests/unit/test_admission_state_machine.py
          tests/unit/test_b2_1_admission_milestone_events.py
          tests/integration/test_delete_profile_revert.py
          tests/repositories/test_admission_soft_delete_excluded.py
          tests/unit/test_admission_report_helpers.py
          tests/repositories/test_admission_report_integration.py
          tests/api/test_admission_report_api.py
          tests/integration/test_sts20_consult_giveup.py
          -q --tb=short --timeout=60

      # =====================================================================
      # Tier 5: Phase 2 engine prereqs (Phase 3 builds laterally on these)
      # =====================================================================
      - name: pytest — Phase 2 engine prereqs
        working-directory: Backend_FastAPI
        run: >-
          python -m pytest
          tests/unit/test_phase2_engine_3tier_resolution.py
          tests/unit/test_phase2_engine_quota_chain_v8.py
          tests/unit/test_phase2_engine_snapshot_integrity.py
          tests/unit/test_phase2_pr2c_three_col_unique.py
          tests/services/test_phase2_admission_path_quota_integration.py
          tests/services/test_quota_matrix_funnel.py
          tests/services/test_coverage_round_info.py
          tests/services/test_can_edit_governance.py
          tests/unit/test_public_admissions_phase1_wave6.py
          tests/unit/test_document_resolution_service.py
          tests/integration/test_document_audience_reresolve.py
          tests/unit/test_docgrp_audience_backfill_migration.py
          tests/integration/test_document_audience_config_panel.py
          -q --tb=short --timeout=60
