name: Deploy to Production

# Sprint S2 hardening item #4 (2026-05-14): the in-line test job was
# removed. Pre-merge branch protection now requires the PR-level gates
# (``pytest`` from backend-test.yml, ``Build`` + ``Check (type+lint+test)``
# from frontend-test.yml, plus the dep audits) to pass before the squash
# commit can land on main. The same content then arrives here, so
# re-running the contract subset on push:main was duplicate work that
# cost 3-5 phút per deploy without catching anything new.
#
# Direct pushes to main are blocked by the ``main branch protection``
# ruleset (Block force pushes + Restrict deletions + Require PR before
# merging). Anyone reaching push:main has already passed the PR gates.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Không dùng `push.paths`/`paths-ignore` để quyết định production: GitHub chỉ
# xét một phần hữu hạn của diff cho path filter. Workflow luôn sinh trên main;
# job nhẹ bên dưới đọc TOÀN BỘ `git diff before..after`, rồi mới quyết định có
# tạo job mang `environment: production` hay không.
permissions:
  contents: read

jobs:
  classify-changes:
    name: Classify production impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      classification: ${{ steps.plan.outputs.classification }}
    env:
      PLAN_PATH: ${{ github.workspace }}/deploy-change-plan.json
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần cả `before` lẫn `after`; không dùng compare API hay danh sách
          # changed-files bị cắt ngắn.
          fetch-depth: 0

      - name: Phân loại toàn bộ diff theo hướng fail-closed
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python .github/scripts/deploy_change_classifier.py classify \
            --event "$EVENT_NAME" \
            --before "$BEFORE_SHA" \
            --after "$AFTER_SHA" \
            --artifact "$PLAN_PATH"

      - name: Lưu bằng chứng phân loại kể cả khi BLOCK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-change-plan-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ env.PLAN_PATH }}
          if-no-files-found: error
          retention-days: 90

  reap-stale-production-runs:
    name: Reap stale production runs
    needs: classify-changes
    # `always()` là bản chất, không phải khẩu vị: job này PHẢI chạy cả khi
    # classify kết luận SAFE_NO_DEPLOY — đó CHÍNH LÀ ca sinh ra lỗ hổng.
    #
    # Đo 24-09-2026: ba push DEPLOY liên tiếp dọn được run cũ trong 11-16 giây
    # nhờ `cancel-in-progress` của job `deploy`; nhưng push safe `0b2dd8a7`
    # (xong sau 14 giây, job `deploy` bị `if:` loại nên không vào nhóm
    # concurrency) KHÔNG dọn gì, để deployment 6637504446 nằm `waiting` thêm
    # 83 phút với một SHA mà cổng SHA chắc chắn sẽ từ chối. Approve nó = đốt
    # một lượt phê duyệt để lấy một deployment đỏ.
    #
    # Gate job này theo `deploy == 'true'` là tái tạo đúng lỗi ấy.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # KHÔNG `environment:` — job dọn thứ đang chờ duyệt thì không được tự đi
    # chờ duyệt. KHÔNG nhóm `deploy-production` — mượn nhóm ấy là dựa vào một
    # hành vi CHƯA AI ĐO: liệu một job không có `environment` khi vào nhóm có
    # huỷ nổi một job đang chờ duyệt hay không. Mọi ca đã quan sát đều là giữa
    # hai job ĐỀU CÓ `environment`.
    #
    # Repo đặt `default_workflow_permissions=read`, nên khối dưới XIN nâng lên
    # `actions: write`. ĐÃ ĐO chứ không còn suy từ tài liệu: một request
    # `POST …/actions/runs/{id}/cancel` gửi bằng `GITHUB_TOKEN` với đúng khai
    # báo này trả về HTTP 409 kèm thông báo về TRẠNG THÁI của run ("cannot
    # cancel a workflow run that is completed") — tức request đã đi qua lớp
    # quyền. Không quan sát thấy 403/404 vì lý do quyền.
    #
    # Đó là phép đo về QUYỀN, không phải về mọi trạng thái: một lượt huỷ lên
    # run đang `waiting` chưa từng được thử, và không thử được nếu không dựng
    # một deployment production thật đang chờ. Nên hành vi fail-closed bên dưới
    # GIỮ NGUYÊN: runtime bị từ chối vì bất cứ lý do gì thì job này đỏ và
    # `deploy` bị chặn, chứ không lặng lẽ bỏ qua việc dọn.
    permissions:
      actions: write
    steps:
      - name: Huỷ run production chờ duyệt cho SHA đã bị main vượt qua
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_TIP_SHA: ${{ github.sha }}
          GH_WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          API_URL = os.environ["GH_API_URL"].rstrip("/")
          REPO = os.environ["GH_REPO"]
          TOKEN = os.environ["GH_TOKEN"]
          RUN_ID = int(os.environ["GH_RUN_ID"])
          RUN_NUMBER = int(os.environ["GH_RUN_NUMBER"])
          TIP_SHA = os.environ["GH_TIP_SHA"].strip().lower()
          WORKFLOW_FILE = os.environ["GH_WORKFLOW_REF"].split("@")[0].rsplit("/", 1)[-1]


          def stop(reason):
              # Job `deploy` khai job này trong `needs` VÀ trong `if`, nên thoát
              # khác 0 ở đây là CHẶN deploy — không phải lặng lẽ bỏ qua việc dọn.
              print("::error::reaper DUNG: " + reason)
              sys.exit(1)


          def call(method, path):
              req = urllib.request.Request(API_URL + "/" + path, method=method)
              req.add_header("Authorization", "Bearer " + TOKEN)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read()
                      return resp.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as err:
                  return err.code, None
              except Exception as err:
                  # Mang/DNS/timeout: KHONG biet co run stale hay khong.
                  stop("%s %s that bai: %s" % (method, path, err.__class__.__name__))


          status, payload = call(
              "GET",
              "repos/%s/actions/workflows/%s/runs?status=waiting&per_page=100"
              % (REPO, WORKFLOW_FILE),
          )
          if status != 200 or not isinstance(payload, dict):
              stop(
                  "khong liet ke duoc run dang cho duyet (HTTP %s). Khong ket luan "
                  "duoc gi nen KHONG cho deploy di tiep." % status
              )

          stale = []
          for run in payload.get("workflow_runs") or []:
              if int(run.get("id") or 0) == RUN_ID:
                  continue
              # KHONG tin bo loc `status=waiting` cua API - hoi lai ban ghi.
              if run.get("status") != "waiting":
                  continue
              if (run.get("head_sha") or "").strip().lower() == TIP_SHA:
                  continue
              # Chi dong toi run CU hon chinh minh. Rule `non_fast_forward` cua
              # ruleset main bao dam main chi tien, nen mot run cu mang SHA khac
              # khong bao gio deploy duoc nua. Thieu ve nay thi hai push lien
              # tiep se lam run MOI bi run CU huy nham.
              if int(run.get("run_number") or 0) >= RUN_NUMBER:
                  continue
              stale.append(run)

          for run in stale:
              rid = int(run["id"])
              sha = (run.get("head_sha") or "")[:10]
              status, _ = call("POST", "repos/%s/actions/runs/%d/cancel" % (REPO, rid))
              if status == 202:
                  print("da huy run %d (sha %s) - main da vuot qua no" % (rid, sha))
              elif status == 403:
                  stop(
                      "HTTP 403 khi huy run %d: GITHUB_TOKEN khong co quyen "
                      "`actions: write`. Repo dang dat default_workflow_permissions"
                      "=read - kiem Settings > Actions > Workflow permissions. "
                      "DUNG, khong cho deploy di tiep." % rid
                  )
              elif status == 409:
                  # 409 CHI vo hai sau khi doc lai va thay run da roi `waiting`.
                  lai, ban_ghi = call("GET", "repos/%s/actions/runs/%d" % (REPO, rid))
                  if lai != 200 or not isinstance(ban_ghi, dict):
                      stop("409 khi huy run %d ma doc lai cung hong (HTTP %s)" % (rid, lai))
                  if ban_ghi.get("status") == "waiting":
                      stop("409 khi huy run %d nhung no VAN waiting - khong phai race vo hai" % rid)
                  print("run %d da roi waiting (%s) truoc khi kip huy - vo hai" % (rid, ban_ghi.get("status")))
              else:
                  stop("HTTP %s khi huy run %d" % (status, rid))

          print("reaper xong: %d run stale da duoc don" % len(stale))
          PY

  deploy:
    name: Deploy to VPS
    needs: [classify-changes, reap-stale-production-runs]
    # Chỉ job này sở hữu environment + concurrency production. Một push chỉ
    # chứa CI/test/docs sẽ skip TRƯỚC hai cơ chế đó, nên không tạo pending
    # deployment và không huỷ deployment thật đang chờ duyệt.
    #
    # `reap-stale-production-runs` phải có mặt ở CẢ `needs` LẪN `if`. Một job
    # khai `if:` tuỳ biến thì GitHub BỎ yêu cầu `success()` ngầm của `needs`,
    # nên chỉ thêm vào `needs` là chưa đủ: reaper đỏ (ví dụ 403 vì thiếu
    # `actions: write`) mà deploy vẫn chạy ⇒ cơ chế dọn stale tự biến thành
    # fail-open, đúng thứ nó sinh ra để loại bỏ.
    if: >-
      needs.classify-changes.result == 'success' &&
      needs.classify-changes.outputs.deploy == 'true' &&
      needs.reap-stale-production-runs.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: true

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # SHA mà run NÀY được sinh ra để deploy. Phải đi qua `envs:` bên dưới
          # thì script trên VPS mới thấy được.
          SHA_MONG_DOI: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          envs: SHA_MONG_DOI
          script: |
            set -euo pipefail
            cd /opt/qlts

            # 🚨 SELF-UPDATE: bash nạp toàn bộ script vào bộ nhớ lúc gọi. Nếu
            # gọi `./scripts/deploy.sh` ngay thì bản CŨ chạy, rồi Step 2 của nó
            # `git pull` cây mới — nhưng logic đang chạy vẫn là bản cũ. Lần
            # deploy đầu sau mỗi lần sửa deploy.sh vì thế chạy sai bản, và với
            # commit rename template thì nó dừng hẳn vì đọc đường đã biến mất.
            # (Caveat này được ghi ngay trong scripts/deploy.sh, nhưng workflow
            # chưa từng tuân theo.)
            #
            # Thứ tự đúng: cập nhật cây TRƯỚC, xác minh, rồi mới nạp script.
            git fetch origin main

            # 🚨 CỔNG SHA: job này dừng ở `environment: production` chờ duyệt.
            # Giữa lúc run được sinh ra và lúc có người bấm approve, `main` có
            # thể đã nhận thêm commit. `git pull --ff-only origin main` khi ấy
            # kéo về TIP MỚI NHẤT, nên run mang metadata của commit A lại đi
            # deploy commit B — không ai đọc log mà thấy được, vì trước đây chỗ
            # này chỉ `echo` ra SHA chứ không đối chiếu với gì cả.
            #
            # Fail-closed: lệch thì DỪNG, không tự deploy tip mới. Muốn deploy
            # tip mới thì chạy lại workflow trên chính commit đó.
            SHA_TIP=$(git rev-parse FETCH_HEAD)
            if [ "$SHA_TIP" != "$SHA_MONG_DOI" ]; then
              echo "🔴 DỪNG: origin/main đang ở $SHA_TIP, còn run này được sinh cho $SHA_MONG_DOI."
              echo "   Cây /opt/qlts KHÔNG bị đụng. Chạy lại Deploy trên đúng commit cần lên."
              exit 1
            fi

            # Ghim tường minh thay vì `pull` trống: cùng kết quả khi cổng trên
            # đạt, nhưng đọc log là thấy ngay ta đang đưa cây tới ĐÚNG commit nào.
            git merge --ff-only "$SHA_MONG_DOI"

            SHA=$(git rev-parse HEAD)
            if [ "$SHA" != "$SHA_MONG_DOI" ]; then
              echo "🔴 DỪNG: sau merge HEAD=$SHA, chờ $SHA_MONG_DOI"
              exit 1
            fi
            echo "Deploy tại $SHA"
            test -f scripts/deploy.sh || { echo "Thiếu scripts/deploy.sh"; exit 1; }
            test -f nginx/templates/default.conf.template || {
              echo "Thiếu nginx/templates/default.conf.template"; exit 1; }

            # `bash scripts/deploy.sh` chứ không `/tmp/deploy_NEW.sh`: script
            # suy PROJECT_DIR từ BASH_SOURCE, nên bản chép sang /tmp sẽ tính
            # project root thành `/`.
            bash scripts/deploy.sh
