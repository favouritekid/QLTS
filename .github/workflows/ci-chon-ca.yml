name: Chạy chọn ca backend (thủ công)

# ============================================================================
# 23-11-2026 — chạy RIÊNG vài tệp / node id pytest backend trên một nhánh ĐÃ
# ĐẨY (thường là `ci/<việc>`): vài phút, MỘT job, thay vì 14 lát của cổng PR
# hay 12 lát của nightly (~1 giờ, cộng hàng chờ vì trần 20 job của kho).
#
# Dùng cho biến thể kiểm ngược (CLAUDE.md §3) và lần sửa nhỏ cần pytest THẬT
# trên Postgres + Redis THẬT mà không phải chờ cả cổng:
#
#     gh workflow run ci-chon-ca.yml --ref ci/<nhánh> \
#       -f ca="tests/unit/test_x.py tests/api/test_y.py::test_z"
#
# ⚠️ GitHub chỉ nhận dispatch cho workflow đã có trên nhánh MẶC ĐỊNH (`main`),
# rồi chạy BẢN workflow của `--ref` — nhánh `--ref` cũng phải chứa tệp này.
#
# KHÔNG phải required check và KHÔNG thay cổng PR. Xanh ở đây chỉ nói: đúng các
# ca được chọn, trên đúng HEAD của `--ref`, đã chạy đủ và đạt. Nó không nói gì
# về các ca KHÔNG được chọn.
#
# Fail-closed — mỗi điểm khoá trong
# `Backend_FastAPI/tests/unit/test_ci_test_visibility.py::TestWorkflowChayChonCa`:
#   1. Trigger DUY NHẤT `workflow_dispatch`: không `push`, `pull_request`,
#      `pull_request_target`, `schedule`, `workflow_call`.
#   2. Input `ca` vào shell CHỈ qua `env:` của MỘT bước (`kiem`); không `run:`
#      nào chứa biểu thức (chống chèn lệnh). Bước `kiem` đối chiếu TỪNG mục với
#      một mẫu chặt, từ chối mục sai / trùng / chồng lấn / tệp không tồn tại,
#      rồi mới ghi danh sách. Các bước sau đọc DANH SÁCH ĐÃ KIỂM, không đọc lại
#      input. Một mục sai ⇒ không chạy gì (không chạy một phần danh sách).
#   3. Collect ra 0 ca ⇒ ĐỎ; MỘT mục collect ra 0 ca ⇒ ĐỎ (tệp skip cả module
#      là kiểu xanh giả kinh điển); lỗi collect ⇒ ĐỎ.
#   4. TẬP ca chạy (JUnit) phải ĐÚNG tập node id collect — không chỉ cùng số
#      lượng; pytest rc khác 0 ⇒ ĐỎ; có ca failed / errors ⇒ ĐỎ.
#      0 ca PASSED (vd. marker / fixture skip TOÀN BỘ sau collect, pytest vẫn
#      thoát 0) ⇒ ĐỎ; MỘT mục mà mọi ca đều skip ⇒ ĐỎ. Skip một phần ⇒ cảnh
#      báo, và kết luận in rõ số ca SKIP (không được kiểm).
#      Không nuốt mã lỗi, không `continue-on-error`, không `if:`.
#   5. Tên job không chứa tên required check nào (`pytest`, `Build`, …): một
#      lượt chạy MỘT PHẦN không bao giờ được thoả required check của PR.
#   6. `permissions: contents: read`; không secret, không `environment`.
#   7. `concurrency` riêng TỪNG lượt (`github.run_id`): không huỷ lượt nào.
#
# CỐ Ý không có input chia lát: workflow này cho VÀI tệp. Chạy nhiều thì dùng
# `backend-test.yml` (dispatch, đủ cổng PR) hoặc `nightly-backend-pytest.yml`
# (toàn bộ backend, input `shards`).
#
# Môi trường — runner, services, env, cài deps, `BO_QUA`, `--timeout=60` — soi
# gương job `pytest-shard` của `nightly-backend-pytest.yml`; test khoá bằng
# nhau, lệch một khoá là đỏ.

on:
  workflow_dispatch:
    inputs:
      ca:
        description: 'Tệp / node id dưới tests/, cách nhau bằng khoảng trắng hoặc xuống dòng. Vd: tests/unit/test_x.py tests/api/test_y.py::test_z'
        required: true
        type: string

# Một scope ⇒ mọi scope khác là `none`. `contents: read` đủ cho checkout.
permissions:
  contents: read

# Nhóm riêng cho TỪNG lượt (`run_id` duy nhất) ⇒ không lượt nào huỷ lượt nào,
# kể cả hai lượt trên cùng một nhánh.
concurrency:
  group: ci-chon-ca-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  # ĐỒNG BỘ với `nightly-backend-pytest.yml` (test khoá bằng nhau).
  BO_QUA: "--ignore-glob=tests/integration/test_debug*.py"

jobs:
  chon-ca:
    # Tên TĨNH, không chứa tên required check nào — xem điểm 5 ở đầu tệp.
    name: chạy chọn ca backend
    # Cùng ảnh runner với lát nightly (ghim 24.04, lý do ở nightly-backend-pytest.yml).
    runs-on: ubuntu-24.04
    # Dành cho vài tệp. Một tệp nặng nhất của cổng PR chạy ~4 phút; trần này
    # chỉ chặn một lượt treo giữ runner tới trần mặc định 6 giờ.
    timeout-minutes: 60

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/qlts_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only
      JWT_SECRET_KEY: test-jwt-secret-for-ci-only
      MAIL_USERNAME: ci-test@example.com
      MAIL_PASSWORD: ci-test-placeholder
      MAIL_FROM: ci-test@example.com
      MAIL_SERVER: smtp.example.com

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: qlts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # NƠI DUY NHẤT input chạm tới shell, và chỉ như một BIẾN MÔI TRƯỜNG —
      # không bao giờ được dán vào thân `run:` (đó là chèn lệnh).
      # Chạy TRƯỚC khi cài phụ thuộc: input sai thì đỏ sau vài giây.
      - name: Kiểm danh sách ca (input → danh sách đã kiểm)
        id: kiem
        working-directory: Backend_FastAPI
        env:
          CA: ${{ inputs.ca }}
        run: |
          set -euo pipefail
          # So khớp theo BYTE: dưới locale UTF-8, khoảng `[A-Za-z]` có thể
          # khớp cả chữ có dấu hay chữ trông giống Latin.
          export LC_ALL=C

          # Mẫu cho MỘT mục, ghép từ ba mảnh:
          #   tệp   tests/<thư mục>/…/test_<tên>.py  — chữ, số, `_` (không `.`, không `-`)
          #   tên   ::Lớp, ::hàm                      — định danh Python
          #   tham  [id]                              — chỉ ở CUỐI, sau ít nhất một ::tên
          # Vì mục phải bắt đầu bằng `tests/`, nó không bao giờ thành CỜ pytest.
          RE_TEP='tests/([A-Za-z0-9_]+/)*test_[A-Za-z0-9_]*[.]py'
          RE_TEN='::[A-Za-z_][A-Za-z0-9_]*'
          RE_THAM='[[][A-Za-z0-9_.,:=+/@%-]+[]]'
          RE_MUC="^${RE_TEP}(${RE_TEN})*(${RE_TEN}${RE_THAM})?\$"

          # Tách theo khoảng trắng / tab / xuống dòng (cả CR của CRLF).
          mapfile -t THO < <(printf '%s\n' "${CA:-}" | tr ' \t\r' '\n\n\n')

          HOP_LE=()
          LOI=0
          for muc in "${THO[@]}"; do
            [ -n "$muc" ] || continue

            ly_do=""
            case "$muc" in
              -*) ly_do="bắt đầu bằng '-' — pytest sẽ hiểu là CỜ" ;;
              *..*) ly_do="chứa '..'" ;;
            esac
            if [ -z "$ly_do" ] && [[ ! $muc =~ $RE_MUC ]]; then
              ly_do="không khớp mẫu tests/…/test_*.py[::Lớp][::hàm][[id]]"
            fi
            if [ -n "$ly_do" ]; then
              printf '::error::Mục bị từ chối: %s — %s\n' "$muc" "$ly_do"
              LOI=$((LOI + 1))
              continue
            fi

            tep="${muc%%::*}"
            if [ ! -f "$tep" ]; then
              printf '::error::Mục bị từ chối: %s — không có tệp %s trên ref này (tính từ Backend_FastAPI/)\n' "$muc" "$tep"
              LOI=$((LOI + 1))
              continue
            fi

            # Trùng / chồng lấn: một ca thuộc hai mục thì đếm theo mục sai,
            # và pytest có thể chạy nó hai lần hoặc gộp lặng lẽ.
            for cu in "${HOP_LE[@]}"; do
              case "$muc" in
                "$cu")
                  printf '::error::Mục bị từ chối: %s — TRÙNG với mục đã có\n' "$muc"
                  LOI=$((LOI + 1))
                  continue 2
                  ;;
                "$cu::"*|"$cu["*)
                  printf '::error::Mục bị từ chối: %s — nằm trong mục đã có %s (chồng lấn)\n' "$muc" "$cu"
                  LOI=$((LOI + 1))
                  continue 2
                  ;;
              esac
              case "$cu" in
                "$muc::"*|"$muc["*)
                  printf '::error::Mục bị từ chối: %s — chứa mục đã có %s (chồng lấn)\n' "$muc" "$cu"
                  LOI=$((LOI + 1))
                  continue 2
                  ;;
              esac
            done
            HOP_LE+=("$muc")
          done

          if [ "$LOI" -ne 0 ]; then
            echo "::error::$LOI mục bị từ chối — KHÔNG chạy gì (không chạy một phần danh sách)."
            exit 1
          fi
          if [ "${#HOP_LE[@]}" -eq 0 ]; then
            echo "::error::Input 'ca' rỗng — không có gì để chạy."
            exit 1
          fi
          printf '%s\n' "${HOP_LE[@]}" > "$RUNNER_TEMP/ca.txt"
          echo "Danh sách đã kiểm: ${#HOP_LE[@]} mục"
          printf '  %s\n' "${HOP_LE[@]}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Backend_FastAPI/requirements-dev.txt

      - name: Install backend dependencies (dev)
        working-directory: Backend_FastAPI
        run: pip install -r requirements-dev.txt

      # Đếm TRƯỚC khi chạy, theo TỪNG mục. Chỉ đếm tổng thì một tệp skip cả
      # module (hoặc một node id gõ sai mà pytest vẫn thoát 0) bị các mục khác
      # che đi.
      - name: Thu thập (collect-only) — đếm ca theo từng mục
        id: thu-thap
        working-directory: Backend_FastAPI
        run: |
          set -euo pipefail
          mapfile -t DANH_SACH < "$RUNNER_TEMP/ca.txt"
          if [ "${#DANH_SACH[@]}" -eq 0 ]; then
            echo "::error::Danh sách đã kiểm rỗng."
            exit 1
          fi
          THO="$RUNNER_TEMP/collect-raw.txt"
          NODE="$RUNNER_TEMP/nodeid.txt"

          # `-qq`, KHÔNG phải `-q`: pytest.ini đặt `addopts = -v`; `-v` gặp `-q`
          # thành mức mặc định, và ở mức đó `--collect-only` in CÂY chứ không
          # in node id — phép đếm bên dưới sẽ ra 0 (đã đo ở nightly).
          rc=0
          python -m pytest "${DANH_SACH[@]}" --collect-only -qq "$BO_QUA" > "$THO" 2>&1 || rc=$?

          if grep -q '^ERROR ' "$THO"; then
            echo "::error::Có lỗi khi COLLECT — pytest bỏ luôn danh sách node id."
            grep '^ERROR ' "$THO"
            tail -n 30 "$THO"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::pytest --collect-only thoát $rc (4 = node id không tồn tại, 5 = không collect được ca nào)."
            tail -n 30 "$THO"
            exit 1
          fi

          # Node id = dòng bắt đầu bằng `tests/….py::`. `sort -u` vì phần tóm
          # tắt cảnh báo có thể in lại node id.
          awk '/^tests\/[^[:space:]]*[.]py::/' "$THO" | LC_ALL=C sort -u > "$NODE"
          SO_CA=$(awk 'END { print NR }' "$NODE")
          if [ "$SO_CA" -eq 0 ]; then
            echo "::error::Collect ra 0 ca — không có gì để chạy, lượt này KHÔNG được xanh."
            tail -n 30 "$THO"
            exit 1
          fi

          # Bảng mục → node id (TAB giữa hai cột): nguồn DUY NHẤT cho bước `chay`
          # về tập ca phải chạy và ca nào thuộc mục nào. Ghi ra tệp tạm, chỉ
          # đổi tên thành tệp thật khi bước này đạt.
          echo "Số ca collect theo từng mục:"
          TAM="$RUNNER_TEMP/muc_nodeid.tmp"
          : > "$TAM"
          TONG=0
          LOI=0
          for muc in "${DANH_SACH[@]}"; do
            n=$(MUC="$muc" RA="$TAM" awk '
              BEGIN { p = ENVIRON["MUC"]; d = length(p); ra = ENVIRON["RA"] }
              index($0, p) == 1 {
                sau = substr($0, d + 1, 1)
                if (length($0) == d || sau == ":" || sau == "[") { c++; print p "\t" $0 >> ra }
              }
              END { print c + 0 }' "$NODE")
            printf '  %6s  %s\n' "$n" "$muc"
            TONG=$((TONG + n))
            if [ "$n" -eq 0 ]; then
              printf '::error::Mục %s collect ra 0 ca (skip cả module? tên sai?) — chạy tiếp là XANH GIẢ.\n' "$muc"
              LOI=$((LOI + 1))
            fi
          done
          if [ "$TONG" -ne "$SO_CA" ]; then
            echo "::error::Tổng theo mục ($TONG) khác số node id collect ($SO_CA) — có ca không thuộc mục nào."
            LOI=$((LOI + 1))
          fi
          if [ "$LOI" -ne 0 ]; then
            exit 1
          fi
          mv "$TAM" "$RUNNER_TEMP/muc_nodeid.tsv"
          echo "Collect: $SO_CA ca từ ${#DANH_SACH[@]} mục."

      - name: Chạy pytest trên các ca đã chọn
        id: chay
        working-directory: Backend_FastAPI
        run: |
          set -euo pipefail
          mapfile -t DANH_SACH < "$RUNNER_TEMP/ca.txt"
          JUNIT="$RUNNER_TEMP/junit.xml"
          rm -f "$JUNIT"

          # Cùng cờ với lát nightly: `--timeout=60` cắt một ca treo.
          rc=0
          python -m pytest "${DANH_SACH[@]}" -q --tb=short --timeout=60 "$BO_QUA" --junit-xml="$JUNIT" || rc=$?
          echo "pytest rc=$rc"

          # MỌI phán quyết của bước này nằm ở MỘT chỗ — đoạn dưới: rc, danh tính
          # ca, ca đỏ, skip. Nó tích luỹ lỗi rồi thoát theo TỔNG (thoát theo lệnh
          # cuối là cách một bộ kiểm in "SAI" mà vẫn trả 0); `set -e` đưa mã
          # thoát ra thành kết quả bước.
          python - "$JUNIT" "$RUNNER_TEMP/muc_nodeid.tsv" "$rc" <<'PY'
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          duong_junit, duong_bang, rc = sys.argv[1], sys.argv[2], int(sys.argv[3])


          def khoa_junit(node):
              """Node id → (classname, name) ĐÚNG như junitxml của pytest ghi
              (`_pytest.junitxml.mangle_test_address`; test khoá hai bản bằng
              nhau). Ánh xạ XUÔI, không dựng ngược từ JUnit: `classname` có
              dấu chấm vừa của thư mục vừa của lớp lồng, dựng ngược không tin
              được."""
              duong, mo, tham = node.partition("[")
              ten = duong.split("::")
              ten[0] = re.sub(r"\.py$", "", ten[0].replace("/", "."))
              ten[-1] += mo + tham
              return ".".join(ten[:-1]), ten[-1]


          # Mục → node id, do bước `thu-thap` ghi: tập ca PHẢI chạy.
          muc_cua = {}
          with open(duong_bang, encoding="utf-8") as fh:
              for dong_bang in fh:
                  muc, node = dong_bang.rstrip("\n").split("\t", 1)
                  muc_cua.setdefault(muc, []).append(node)
          mong = {khoa_junit(n): n for cac in muc_cua.values() for n in cac}

          loi = []
          if rc != 0:
              loi.append("pytest rc=%d (1 = có ca đỏ, 2 = bị ngắt, 3 = lỗi nội bộ, "
                         "4 = dùng sai hoặc node id chết, 5 = không collect được ca nào)." % rc)

          # Trạng thái theo CA. Một ca đỏ ở call rồi lỗi ở teardown có HAI
          # <testcase> cùng tên — giữ trạng thái nặng nhất.
          NANG = ("passed", "skipped", "failed", "errors")
          trang_thai = {}
          if os.path.isfile(duong_junit):
              for tc in ET.parse(duong_junit).getroot().iter("testcase"):
                  if tc.find("error") is not None:
                      moi = "errors"
                  elif tc.find("failure") is not None:
                      moi = "failed"
                  elif tc.find("skipped") is not None:
                      moi = "skipped"
                  else:
                      moi = "passed"
                  k = (tc.get("classname") or "", tc.get("name") or "")
                  cu = trang_thai.get(k)
                  if cu is None or NANG.index(moi) > NANG.index(cu):
                      trang_thai[k] = moi
          else:
              loi.append("Không có JUnit XML — phiên pytest không chạy tới cuối.")

          dem = {t: sum(1 for v in trang_thai.values() if v == t) for t in NANG}
          dong = ("collect %d · chạy %d · passed %d · failed %d · errors %d · skipped %d"
                  % (len(mong), len(trang_thai), dem["passed"], dem["failed"],
                     dem["errors"], dem["skipped"]))
          print(dong)

          # (1) DANH TÍNH: tập ca chạy phải ĐÚNG tập ca collect, không chỉ cùng số lượng.
          thieu = sorted(n for k, n in mong.items() if k not in trang_thai)
          thua = sorted("%s::%s" % k for k in trang_thai if k not in mong)
          if thieu or thua:
              loi.append("Tập ca chạy KHÁC tập ca collect: thiếu %d, thừa %d."
                         % (len(thieu), len(thua)))
              for n in thieu[:30]:
                  print("  THIẾU %s" % n)
              for k in thua[:30]:
                  print("  THỪA  %s" % k)
          # (2) Có ca đỏ.
          if dem["failed"] or dem["errors"]:
              loi.append("%d ca failed, %d ca errors." % (dem["failed"], dem["errors"]))
          # (3) 0 ca PASSED — vd. marker / fixture skip TOÀN BỘ sau collect, rc vẫn 0.
          if dem["passed"] == 0:
              loi.append("0 ca PASSED (chạy %d, skip %d) — không ca nào thật sự được kiểm."
                         % (len(trang_thai), dem["skipped"]))
          # (4) MỘT mục mà mọi ca đều skip: các mục khác không được che nó.
          for muc, cac in muc_cua.items():
              tt = [trang_thai.get(khoa_junit(n)) for n in cac]
              if tt and all(t == "skipped" for t in tt):
                  loi.append("Mục %s: toàn bộ %d ca bị SKIP." % (muc, len(tt)))

          if dem["skipped"]:
              print("::warning::%d ca bị SKIP — đã chạy nhưng KHÔNG được kiểm. Đọc lý do "
                    "trước khi coi lượt này là bằng chứng." % dem["skipped"])
              for k in sorted(k for k, v in trang_thai.items() if v == "skipped")[:30]:
                  print("  SKIP %s::%s" % k)

          if loi:
              ket_luan = "ĐỎ — %d lỗi." % len(loi)
          elif dem["skipped"]:
              ket_luan = ("%d/%d ca PASSED, %d ca SKIP (KHÔNG được kiểm)."
                          % (dem["passed"], len(mong), dem["skipped"]))
          else:
              ket_luan = "%d/%d ca PASSED, không ca nào skip." % (dem["passed"], len(mong))
          for dong_loi in loi:
              print("::error::" + dong_loi)
          print("KẾT LUẬN: " + ket_luan)
          tom_tat = os.environ.get("GITHUB_STEP_SUMMARY")
          if tom_tat:
              with open(tom_tat, "a", encoding="utf-8") as fh:
                  fh.write("### Chạy chọn ca\n\n%s\n\nKẾT LUẬN: %s\n" % (dong, ket_luan))
          sys.exit(1 if loi else 0)
          PY
