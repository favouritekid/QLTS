# Config HỢP LỆ về cú pháp nhưng KHÔNG có server block phục vụ /health.
# `nginx -t` sẽ xanh; healthcheck phải đỏ.
services:
  nginx:
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tests-e2e/nginx-packaging/rong:/etc/nginx/templates:ro
      - ./nginx-test-certs:/etc/letsencrypt:ro
