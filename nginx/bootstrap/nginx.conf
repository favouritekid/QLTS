# =============================================================================
# nginx.conf TỐI GIẢN cho container bootstrap (scripts/setup-ssl.sh)
# =============================================================================
# Vì sao không dùng chung `nginx/nginx.conf` của production: tệp ấy khai
#     upstream backend  { server backend:8000; }
#     upstream frontend { server frontend:3000; }
# và nginx phân giải hostname upstream NGAY LÚC NẠP CONFIG, vô điều kiện — kể
# cả khi không server block nào proxy tới chúng. Trên một VPS mới, backend và
# frontend chưa hề chạy, nên bootstrap sẽ chết với
#     [emerg] host not found in upstream "backend:8000"
# đúng cái lỗi mà bước bootstrap sinh ra để tránh. Đã tái hiện thật rồi mới
# viết tệp này.
#
# Bootstrap chỉ phục vụ ACME challenge từ đĩa: không upstream, không proxy.
# =============================================================================
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 30;

    include /etc/nginx/conf.d/*.conf;
}
