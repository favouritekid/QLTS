worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging — che token trong $request VÀ $http_referer (V6)
    # ------------------------------------------------------------------
    # Đặt ở khối `http` để phủ MỌI server (80, 443, catch-all) bằng một chỗ.
    # KHÔNG dùng `access_log off` cho trang/API token: (1) không đóng được cửa
    # Referer — trang `/confirm/<token>` tải asset và gọi API ở location KHÁC,
    # mỗi dòng ấy mang nguyên URL trang trong cột referer; (2) mất dấu vết điều
    # tra (IP, giờ, mã trạng thái của lượt thử token). Nên GIỮ dòng, chỉ thay
    # đoạn token bằng `<redacted>`.
    #
    # Tập tiền tố trong regex thứ nhất PHẢI trùng `TOKEN_PATH_PREFIXES` của
    # `Backend_FastAPI/app/core/log_redaction.py` (nguồn chuẩn; `*` = một đoạn
    # hành động) — `tests/unit/test_che_log_token_nginx.py` khoá hai bên.
    # Regex thứ hai che giá trị tham số query có tên chứa `token`
    # (`/reset-password?token=…`).
    #
    # ⚠️ PHẦN DƯ CÒN MỞ: `error_log` in `request: "…"` và `referrer: "…"` khi
    # upstream lỗi (502/504) hoặc khi `limit_req` từ chối — `log_format` không
    # chạm tới. KHÔNG được coi là "đã hết rò token trong log nginx".
    map $request $qlts_request_log {
        default $request;
        "~^(.*?(?:/r/|/lp/|/api/public/sms/landing/|/confirm/|/magic-link/[A-Za-z_-]+/))[^/?#\s]+(.*)$" "$1<redacted>$2";
        "~*^(.*?[?&][a-z0-9_]*token[a-z0-9_]*=)[^&#\s]+(.*)$" "$1<redacted>$2";
    }
    map $http_referer $qlts_referer_log {
        default $http_referer;
        "~^(.*?(?:/r/|/lp/|/api/public/sms/landing/|/confirm/|/magic-link/[A-Za-z_-]+/))[^/?#\s]+(.*)$" "$1<redacted>$2";
        "~*^(.*?[?&][a-z0-9_]*token[a-z0-9_]*=)[^&#\s]+(.*)$" "$1<redacted>$2";
    }
    # Trang mang token trên đường dẫn KHÔNG gửi Referer (đóng cửa Referer tại
    # nguồn). Next (`frontend/next.config.ts`) cũng khai cùng giá trị cho hai
    # trang này — hai tầng đều gửi header nên PHẢI cùng giá trị, nếu không
    # trình duyệt nhận hai chính sách mâu thuẫn và lấy cái đứng sau. Không neo
    # `^` để phủ luôn API token (`/api/admissions/confirm/…`,
    # `/api/v2/admissions/magic-link/…`) — backend vốn đặt `no-referrer` ở đó,
    # trước V6 nginx lại chồng thêm `strict-origin-when-cross-origin`.
    map $uri $qlts_referrer_policy {
        default "strict-origin-when-cross-origin";
        "~/(?:confirm|magic-link)/" "no-referrer";
    }
    log_format main '$remote_addr - $remote_user [$time_local] "$qlts_request_log" '
                    '$status $body_bytes_sent "$qlts_referer_log" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upload limit
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

    # Upstream definitions
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    include /etc/nginx/conf.d/*.conf;
}
