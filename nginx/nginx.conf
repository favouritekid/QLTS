worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging — che token trong $request VÀ $http_referer (V6)
    # ------------------------------------------------------------------
    # Đặt ở khối `http` để phủ MỌI server (80, 443, catch-all) bằng một chỗ.
    # KHÔNG dùng `access_log off` cho trang/API token: (1) không đóng được cửa
    # Referer — trang `/confirm/<token>` tải asset và gọi API ở location KHÁC,
    # mỗi dòng ấy mang nguyên URL trang trong cột referer; (2) mất dấu vết điều
    # tra (IP, giờ, mã trạng thái của lượt thử token). Nên GIỮ dòng, chỉ thay
    # đoạn token bằng `<redacted>`.
    #
    # CẮT TỪ DẤU HIỆU ĐẦU TIÊN (F31): `map` chỉ áp ĐÚNG MỘT regex — regex khớp
    # đầu tiên thắng — nên kiểu "thay một token, giữ nguyên đuôi" để lọt token
    # thứ hai (`/confirm/A?token=B`, `?token=A&refresh_token=B`). Thay vào đó:
    # tìm DẤU HIỆU đầu tiên (tiền tố đường dẫn token, hoặc tham số query có tên
    # chứa `token`) rồi thay TOÀN BỘ phần sau nó bằng `<redacted>` (giữ lại
    # ` HTTP/x` của `$request`). Chứng minh được "hết": phần còn giữ là phần
    # ĐỨNG TRƯỚC dấu hiệu đầu tiên nên không chứa dấu hiệu nào; mọi token đều
    # đứng SAU một dấu hiệu (tính theo tập dấu hiệu dưới đây, `/` khớp cả `%2f`,
    # không phân biệt hoa thường). Đánh đổi chẩn đoán: mất đuôi URL sau dấu hiệu
    # (tham số query khác, đoạn đường dẫn sau token).
    #
    # Tập dấu hiệu PHẢI trùng `nginx_token_marker_alternation()` của
    # `Backend_FastAPI/app/core/log_redaction.py` (nguồn chuẩn: tiền tố
    # `TOKEN_PATH_PREFIXES` + tham số query chứa `token`) —
    # `tests/unit/test_che_log_token_nginx.py` khoá hai bên.
    #
    # `error_log` in `request: "…"` và `referrer: "…"` khi upstream lỗi
    # (502/504) hoặc khi `limit_req` từ chối — `log_format` không chạm tới. N17.10
    # B: mọi location phục vụ URL token (template: `/r/`, `/lp/`, SMS landing,
    # trang `/confirm/` `/magic-link/` `/reset-password`, location tuyển sinh)
    # khai `error_log /dev/null;`; mức `warn` ở trên chỉ còn áp cho location khác.
    # ⚠️ PHẦN DƯ CÒN MỞ: tham số query chứa `token` gửi tới location KHÁC (không
    # có route nào phát URL như vậy — rà 24-10), lỗi xảy ra TRƯỚC khi chọn
    # location (dòng request hỏng), mã hoá kép (`%252F`) và token không đứng sau
    # dấu hiệu nào. KHÔNG được coi là "đã hết rò token trong log nginx".
    map $request $qlts_request_log {
        default $request;
        "~*^(.*?(?:(?:/|%2f)r(?:/|%2f)|(?:/|%2f)lp(?:/|%2f)|(?:/|%2f)api(?:/|%2f)public(?:/|%2f)sms(?:/|%2f)landing(?:/|%2f)|(?:/|%2f)confirm(?:/|%2f)|(?:/|%2f)magic-link(?:/|%2f)[a-z_-]+(?:/|%2f)|[?&][a-z0-9_-]*token[a-z0-9_-]*=))(.*?)( HTTP/[0-9.]+)?$" "$1<redacted>$3";
    }
    map $http_referer $qlts_referer_log {
        default $http_referer;
        "~*^(.*?(?:(?:/|%2f)r(?:/|%2f)|(?:/|%2f)lp(?:/|%2f)|(?:/|%2f)api(?:/|%2f)public(?:/|%2f)sms(?:/|%2f)landing(?:/|%2f)|(?:/|%2f)confirm(?:/|%2f)|(?:/|%2f)magic-link(?:/|%2f)[a-z_-]+(?:/|%2f)|[?&][a-z0-9_-]*token[a-z0-9_-]*=))(.*)$" "$1<redacted>";
    }
    # Trang mang token trên URL KHÔNG gửi Referer (đóng cửa Referer tại nguồn):
    # `/confirm/<token>`, `/magic-link/<action>/<token>`, `/reset-password?token=…`.
    # Next (`frontend/next.config.ts`) cũng khai cùng giá trị cho các trang này
    # — hai tầng đều gửi header nên PHẢI cùng giá trị, nếu không trình duyệt
    # nhận hai chính sách mâu thuẫn và lấy cái đứng sau (test khoá hai tầng
    # bằng nhau). Regex đầu không neo `^` để phủ luôn API token
    # (`/api/admissions/confirm/…`, `/api/v2/admissions/magic-link/…`) — backend
    # vốn đặt `no-referrer` ở đó. `/lp/` (mã SMS) đã tự khai `no-referrer` ở
    # location riêng của template.
    map $uri $qlts_referrer_policy {
        default "strict-origin-when-cross-origin";
        "~/(?:confirm|magic-link)/" "no-referrer";
        "~^/reset-password/?$" "no-referrer";
    }
    log_format main '$remote_addr - $remote_user [$time_local] "$qlts_request_log" '
                    '$status $body_bytes_sent "$qlts_referer_log" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upload limit
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

    # Upstream definitions
    #
    # `keepalive 0` = GIỮ hành vi kết nối của nginx 1.27: mỗi request một kết
    # nối mới tới backend/frontend. Từ 1.29.7 nginx mặc định `keepalive 32 local`
    # + `proxy_http_version 1.1` (cache kết nối rảnh tới 60 s), trong khi gunicorn
    # (`keepalive = 5`) và Next/Node đóng kết nối rảnh sau ~5 s. Đợt nâng nginx vì
    # CVE không đồng thời đổi cách quản lý kết nối; bật pooling là việc riêng,
    # có phép đo riêng. `/socket.io/` tự khai HTTP/1.1 + Upgrade nên không đổi.
    #
    # ⚠️ nginx 1.27.x TỪ CHỐI `keepalive 0` — lùi bản phải lùi CẢ CẶP ảnh +
    # cấu hình (`git checkout <sha> -- nginx/` + `QLTS_NGINX_ANH_GHIM`), không lùi
    # riêng ảnh. `test_upstream_tat_keepalive_giu_hanh_vi_1_27` khoá hai khối.
    upstream backend {
        server backend:8000;
        keepalive 0;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 0;
    }

    include /etc/nginx/conf.d/*.conf;
}
