# =============================================================================
# QLTS Production Docker Compose
# =============================================================================
# Usage:
#   Production:  docker compose --profile production up -d
#   Development: docker compose up -d (uses override file)
# =============================================================================

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qlts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qlts_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlts} -d ${POSTGRES_DB:-qlts_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend (FastAPI + Gunicorn) ---
  backend:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Constructed from POSTGRES_* vars — do NOT also set in .env.production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      # Redis DB allocation: 1=cache+socketio, 2=celery broker, 3=celery results
      # Must match config.py defaults to avoid mismatch if env vars are unset
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
    volumes:
      - backend_uploads:/app/uploads
      - backend_static_uploads:/app/app/static/uploads
      - geoip_data:/app/geoip
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q default,celery --loglevel=info --concurrency=2
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
    volumes:
      - backend_static_uploads:/app/app/static/uploads
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      disable: true

  # --- Celery Beat (SINGLETON - never scale beyond 1) ---
  celery-beat:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
    volumes:
      - backend_static_uploads:/app/app/static/uploads
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    healthcheck:
      disable: true

  # --- Frontend (Next.js Standalone) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_FF_PERMISSION_HOOK: ${NEXT_PUBLIC_FF_PERMISSION_HOOK:-false}
        NEXT_PUBLIC_FF_ERROR_HANDLER: ${NEXT_PUBLIC_FF_ERROR_HANDLER:-false}
        NEXT_PUBLIC_FF_STATUS_CONFIG: ${NEXT_PUBLIC_FF_STATUS_CONFIG:-false}
        NEXT_PUBLIC_FF_STRICT_PERMISSIONS: ${NEXT_PUBLIC_FF_STRICT_PERMISSIONS:-false}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # --- Nginx (Reverse Proxy + SSL) ---
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - backend_uploads:/app/uploads:ro
      - backend_static_uploads:/app/static/uploads:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --- Certbot (SSL Certificate Management) ---
  certbot:
    image: certbot/certbot
    profiles:
      - production
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Auto-renewal: check every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_static_uploads:
  geoip_data:
  backend_logs:
  certbot_certs:
  certbot_www:
