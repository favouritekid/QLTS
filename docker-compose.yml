# =============================================================================
# QLTS Production Docker Compose
# =============================================================================
# Usage:
#   Production:  docker compose --profile production up -d
#   Development: docker compose up -d (uses override file)
# =============================================================================

# Default log rotation policy. Docker's json-file driver retains logs
# indefinitely without explicit limits, and a deploy/restart wipes the
# in-memory ring buffer that `docker logs` reads. Cap at 50MB × 10 files
# (compressed) → ~500MB per service, ~7-10 days retention at current traffic.
# Anchor referenced by services that benefit most from post-mortem log access.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"
    compress: "true"

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qlts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qlts_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlts} -d ${POSTGRES_DB:-qlts_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend (FastAPI + Gunicorn) ---
  backend:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Constructed from POSTGRES_* vars — do NOT also set in .env.production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      # Redis DB allocation: 1=cache+socketio, 2=celery broker, 3=celery results
      # Must match config.py defaults to avoid mismatch if env vars are unset
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
      # Cold cutover gates per RUNBOOK §7.2 (Phase1-Hotfix-5 / 2026-05-07).
      # Default ``true`` keeps routine deploy unchanged — entrypoint runs
      # alembic + sync_notification_rules + Casbin lifespan auto. When
      # ``COLD_CUTOVER=true ./scripts/deploy.sh`` is invoked, the deploy
      # script ``export``s these = ``false`` and the substitution below
      # propagates them into the container env so docker-entrypoint.sh
      # skips the gates and operator runs the steps manually per
      # RUNBOOK §7.2 T+1:30 / T+3:00 / T+3:15 / T+3:30 sequence.
      # Without these substitution lines, deploy.sh ``export`` had no
      # path into the container (compose only forwards keys explicitly
      # listed here OR present in env_file). Found via Hotfix #4
      # post-merge code review 2026-05-07.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP: ${RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP:-true}
      RUN_CASBIN_LOAD_ON_STARTUP: ${RUN_CASBIN_LOAD_ON_STARTUP:-true}
    volumes:
      - backend_uploads:/app/uploads
      - backend_static_uploads:/app/app/static/uploads
      - sms_private_exports:/app/private_exports
      - geoip_data:/app/geoip
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging: *default-logging

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q default,celery --loglevel=info --concurrency=2
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
      # Cold cutover gates per RUNBOOK §7.2 (Phase1-Hotfix-5).
      # Celery worker shares Backend_FastAPI/Dockerfile so the same
      # docker-entrypoint.sh runs (compose ``command:`` only overrides
      # CMD, NOT ENTRYPOINT). Without these, celery container would
      # auto-run alembic + sync at startup even when backend's gates
      # are set to false → race condition với operator's manual
      # cutover sequence.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP: ${RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP:-true}
      RUN_CASBIN_LOAD_ON_STARTUP: ${RUN_CASBIN_LOAD_ON_STARTUP:-true}
    volumes:
      - backend_static_uploads:/app/app/static/uploads
      - backend_uploads:/app/uploads
      - sms_private_exports:/app/private_exports
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      disable: true
    logging: *default-logging

  # --- Celery Beat (SINGLETON - never scale beyond 1) ---
  celery-beat:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
      # Cold cutover gates per RUNBOOK §7.2 (Phase1-Hotfix-5).
      # Celery beat shares Backend_FastAPI/Dockerfile so the same
      # docker-entrypoint.sh runs (compose ``command:`` only overrides
      # CMD, NOT ENTRYPOINT). Beat container also evaluates the 3 gates
      # before exec — without these flags it auto-runs alembic + sync
      # at startup independently of backend, breaking RUNBOOK §7.2
      # operator-controlled sequence.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP: ${RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP:-true}
      RUN_CASBIN_LOAD_ON_STARTUP: ${RUN_CASBIN_LOAD_ON_STARTUP:-true}
    volumes:
      - backend_static_uploads:/app/app/static/uploads
      - backend_uploads:/app/uploads
      - sms_private_exports:/app/private_exports
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    healthcheck:
      disable: true
    logging: *default-logging

  # --- Frontend (Next.js Standalone) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_FF_PERMISSION_HOOK: ${NEXT_PUBLIC_FF_PERMISSION_HOOK:-false}
        NEXT_PUBLIC_FF_ERROR_HANDLER: ${NEXT_PUBLIC_FF_ERROR_HANDLER:-false}
        NEXT_PUBLIC_FF_STATUS_CONFIG: ${NEXT_PUBLIC_FF_STATUS_CONFIG:-false}
        NEXT_PUBLIC_FF_STRICT_PERMISSIONS: ${NEXT_PUBLIC_FF_STRICT_PERMISSIONS:-false}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # --- Nginx (Reverse Proxy + SSL) ---
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles:
      - production
    environment:
      # envsubst chạy TRONG container nên hai biến này phải có mặt Ở ĐÓ.
      # `--env-file` của Compose chỉ nội suy tệp compose, KHÔNG bơm biến vào
      # container. Thiếu chúng thì `${DOMAIN}` render thành chuỗi rỗng và mọi
      # Host rơi vào catch-all `ssl_reject_handshake`.
      # KHÔNG dùng `${DOMAIN:?}`: Compose nội suy TOÀN BỘ tệp TRƯỚC khi lọc
      # profile, nên `:?` làm gãy cả `docker compose up -d` của dev (không hề
      # bật profile production, không hề chạy nginx). Đã tái hiện: bản có `:?`
      # gãy khi thiếu DOMAIN, bản gốc thì không.
      # Fail-closed chuyển xuống nơi thật sự chạy nginx: healthcheck dưới đây
      # đỏ ngay nếu DOMAIN rỗng, và `scripts/deploy.sh` chặn trước khi khởi động.
      DOMAIN: ${DOMAIN:-}
      NGINX_ADMISSION_FROZEN: ${NGINX_ADMISSION_FROZEN:-false}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Template phải nằm ở /etc/nginx/templates — thư mục DUY NHẤT mà entrypoint
      # chính thức của nginx quét (`20-envsubst-on-templates.sh`:
      # template_dir=/etc/nginx/templates, output_dir=/etc/nginx/conf.d).
      # Trước đây template được mount thẳng vào conf.d, nơi `nginx.conf` chỉ
      # `include *.conf` — nên nó KHÔNG bao giờ được render và nginx chạy với
      # KHÔNG server block nào. Prod sống sót nhờ một `default.conf` đã render
      # nằm NGOÀI git; clean checkout thì chết. Sự cố 12-08-2026.
      - ./nginx/templates:/etc/nginx/templates:ro
      # KHÔNG mount conf.d: entrypoint cần GHI bản render vào đó. Cùng script
      # trên có nhánh `if [ ! -w "$$output_dir" ]` → báo lỗi và bỏ render nếu
      # conf.d là read-only.
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - backend_uploads:/app/uploads:ro
      - backend_static_uploads:/app/static/uploads:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      # Ba lớp, fail-closed. `nginx -t` KHÔNG nằm trong đây: một config rỗng
      # vẫn `syntax is ok`, nên nó không phân biệt được "đang phục vụ" với
      # "không có server block nào" — đúng cái đã lừa cả kíp trực 12-08-2026.
      #   1. DOMAIN phải có mặt trong container (rỗng ⇒ render hỏng);
      #   2. bản render phải tồn tại VÀ mang đúng server_name;
      #   3. phải phục vụ được /health với Host khớp server_name — catch-all
      #      `default_server` trả 444 cho Host lạ, và trang mặc định của image
      #      nginx không có /health, nên bước này loại cả hai ca xanh giả.
      test:
        - CMD-SHELL
        - >-
          test -n "$$DOMAIN"
          && grep -q "server_name $$DOMAIN" /etc/nginx/conf.d/default.conf
          && wget --no-verbose --tries=1 --spider
          --header="Host: $$DOMAIN" http://127.0.0.1/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # --- Certbot (SSL Certificate Management) ---
  certbot:
    image: certbot/certbot
    # Không có restart policy thì certbot KHÔNG dậy lại sau reboot VPS /
    # docker daemon restart => vòng lặp `certbot renew` 12h chết âm thầm và
    # chứng chỉ hết hạn mà không ai biết (nginx vẫn phục vụ cert cũ tới lúc
    # hết hạn). Dòng này đã được sửa TAY trên prod từ 2026-07-15 nhưng chưa
    # từng commit — đưa vào repo để prod và repo không còn lệch.
    restart: unless-stopped
    profiles:
      - production
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Auto-renewal: check every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_static_uploads:
  sms_private_exports:  # PR-4: file Excel export SMS (PII) — private, ngoài webroot
  geoip_data:
  backend_logs:
  certbot_certs:
  certbot_www:
