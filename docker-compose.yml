# =============================================================================
# QLTS Production Docker Compose
# =============================================================================
# Usage:
#   Production:  docker compose --env-file .env.production --profile production up -d
#   Development: docker compose up -d (uses override file)
#
# ⚠️ `--env-file .env.production` là BẮT BUỘC ở mọi lệnh production. Tệp env
# mặc định của Compose là `.env` (chỉ có POSTGRES_*), nên thiếu cờ này thì
# ${DOMAIN} nội suy thành rỗng và nginx TỪ CHỐI khởi động (guard
# `nginx/docker-entrypoint.d/10-qlts-kiem-bien.sh` in rõ nguyên nhân).
# =============================================================================

# Default log rotation policy. Docker's json-file driver retains logs
# indefinitely without explicit limits, and a deploy/restart wipes the
# in-memory ring buffer that `docker logs` reads. Cap at 50MB × 10 files
# (compressed) → ~500MB per service, ~7-10 days retention at current traffic.
# Anchor referenced by services that benefit most from post-mortem log access.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"
    compress: "true"

# Thân chung của hai container nginx: cái ĐANG PHỤC VỤ (`nginx`) và cái DÙNG ĐỂ
# THỬ (`nginx-candidate`). Cùng image, cùng biến, cùng healthcheck — nếu hai bên
# lệch nhau thì phép thử không chứng minh gì cho cái thật. Khác nhau đúng ba
# điểm, khai tường minh dưới service: profile, cổng publish, và chính sách
# restart. Xem `scripts/deploy.sh` Step 8b.
# Biến render, tách riêng để container bootstrap thêm được biến của nó mà không
# đánh mất DOMAIN (YAML không hợp nhất sâu: khai `environment` ở service sẽ THAY
# THẾ nguyên cả map của anchor, chứ không trộn vào).
x-nginx-env: &nginx-env
  # envsubst chạy TRONG container nên hai biến này phải có mặt Ở ĐÓ.
  # `--env-file` của Compose chỉ nội suy tệp compose, KHÔNG bơm biến vào
  # container.
  # KHÔNG dùng `${DOMAIN:?}`: Compose nội suy TOÀN BỘ tệp TRƯỚC khi lọc
  # profile, nên `:?` làm gãy cả `docker compose up -d` của dev (không hề
  # bật profile production, không hề chạy nginx). Đã tái hiện.
  # KHÔNG dùng `env_file: .env.production` (dù nó sẽ chữa được cú trượt tay
  # thiếu `--env-file`): nginx là container quay ra Internet, cho nó thấy
  # SECRET_KEY / JWT_SECRET_KEY / POSTGRES_PASSWORD là đổi một sự cố vận hành
  # lấy một bậc leo thang đặc quyền. Fail-closed đặt ở guard entrypoint.
  DOMAIN: ${DOMAIN:-}
  NGINX_ADMISSION_FROZEN: ${NGINX_ADMISSION_FROZEN:-false}

x-nginx-base: &nginx-base
  restart: unless-stopped
  # Cấu hình nằm TRONG image (nginx/Dockerfile), không bind-mount từ host:
  # bind-mount một thư mục không tồn tại thì daemon TỰ TẠO nó rỗng — đo trên
  # Docker 29.7.2, `create_host_path: false` không ngăn được. Nay thiếu template
  # là `docker build` đỏ, và đổi template là đổi image ID nên `up -d` tự
  # recreate (không cần `--force-recreate` vô điều kiện).
  build:
    context: ./nginx
  image: qlts-nginx:local
  environment: *nginx-env
  volumes:
    - certbot_certs:/etc/letsencrypt:ro
    - certbot_www:/var/www/certbot:ro
    - backend_uploads:/app/uploads:ro
    - backend_static_uploads:/app/static/uploads:ro
  deploy:
    resources:
      limits:
        memory: 128M
  healthcheck:
    # MỘT phép kiểm, đi qua đúng đường mà client thật đi: TLS trên 443 với SNI
    # THẬT là ${DOMAIN}.
    #
    # Vì sao `--resolve` chứ không phải `--header "Host: ..."`: đặt Host mà nối
    # tới 127.0.0.1 thì SNI vẫn là 127.0.0.1, và server block 443 có tên sẽ
    # KHÔNG được chọn — catch-all `ssl_reject_handshake` trả lời. Đó đúng là
    # phép đo sai đã làm cả kíp trực tin site còn sống hôm 12-08-2026.
    # `--resolve` giữ nguyên tên trong URL (nên SNI đúng) mà ép IP đích.
    #
    # Ba ca xanh giả bị loại cùng lúc:
    #   * không có server block nào  → không ai listen 443 có tên → hỏng handshake
    #   * mất trọn khối HTTPS        → chỉ còn catch-all → hỏng handshake
    #   * trang mặc định của image   → đã xoá trong Dockerfile, và không có
    #                                  /nginx-alive
    # So THÂN phản hồi chứ không chỉ mã 200: gỡ `location = /nginx-alive` thì
    # request rơi xuống catch-all → proxy_pass frontend → 200 cho mọi đường
    # dẫn, và phép kiểm chỉ nhìn mã sẽ vẫn xanh. Đã tái hiện (W1-E) rồi vá.
    # `test -n "$$DOMAIN"` giữ lại làm lớp phòng xa; guard entrypoint đã chặn
    # ca này từ trước khi nginx chạy.
    test:
      - CMD-SHELL
      - >-
        test -n "$$DOMAIN"
        && test "$$(curl --fail --silent --insecure --max-time 4
        --resolve "$$DOMAIN:443:127.0.0.1"
        "https://$$DOMAIN/nginx-alive")" = "qlts-nginx-alive"
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s
  logging: *default-logging


services:
  # ⚠️ `env_file: ${QLTS_ENV_FILE:-.env.production}` — KHÔNG hard-code
  # `.env.production`. Bộ E2E `tests-e2e/nginx-packaging/` cần một tệp env khác;
  # khi tên này bị đóng cứng, cách duy nhất để đổi là `cp fixture .env.production`
  # — tức tài liệu E2E hướng dẫn GHI ĐÈ tệp bí mật production, không sao lưu,
  # không khôi phục được (`.env.production` bị .gitignore loại). Chạy nhầm trên
  # /opt/qlts là mất SECRET_KEY/JWT/POSTGRES_PASSWORD.
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qlts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-qlts_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlts} -d ${POSTGRES_DB:-qlts_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Backend (FastAPI + Gunicorn) ---
  backend:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${QLTS_ENV_FILE:-.env.production}
    environment:
      # Constructed from POSTGRES_* vars — do NOT also set in .env.production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      # Redis DB allocation: 1=cache+socketio, 2=celery broker, 3=celery results
      # Must match config.py defaults to avoid mismatch if env vars are unset
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
      # Cold cutover gates per RUNBOOK §7.2 (Phase1-Hotfix-5 / 2026-05-07).
      # Default ``true`` keeps routine deploy unchanged — entrypoint runs
      # alembic + sync_notification_rules + Casbin lifespan auto. When
      # ``COLD_CUTOVER=true ./scripts/deploy.sh`` is invoked, the deploy
      # script ``export``s these = ``false`` and the substitution below
      # propagates them into the container env so docker-entrypoint.sh
      # skips the gates and operator runs the steps manually per
      # RUNBOOK §7.2 T+1:30 / T+3:00 / T+3:15 / T+3:30 sequence.
      # Without these substitution lines, deploy.sh ``export`` had no
      # path into the container (compose only forwards keys explicitly
      # listed here OR present in env_file). Found via Hotfix #4
      # post-merge code review 2026-05-07.
      #
      # ⚠️ Từ 13-08-2026 ba service KHÔNG còn chung ngữ nghĩa startup nữa.
      # ``RUN_MIGRATIONS_ON_STARTUP`` và
      # ``RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP`` chỉ còn nội suy Ở ĐÂY —
      # backend là nơi DUY NHẤT chạy migration + sync. Hai service Celery
      # đóng cứng "false" (xem chú thích tại ``celery-worker``).
      # ``RUN_CASBIN_LOAD_ON_STARTUP`` thì vẫn chung cho cả ba.
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP: ${RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP:-true}
      RUN_CASBIN_LOAD_ON_STARTUP: ${RUN_CASBIN_LOAD_ON_STARTUP:-true}
    volumes:
      - backend_uploads:/app/uploads
      - backend_static_uploads:/app/app/static/uploads
      - sms_private_exports:/app/private_exports
      - geoip_data:/app/geoip
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging: *default-logging

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q default,celery --loglevel=info --concurrency=2
    env_file:
      - ${QLTS_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
      # Celery worker dùng CHUNG Backend_FastAPI/Dockerfile nên chạy cùng
      # docker-entrypoint.sh (compose ``command:`` chỉ đè CMD, KHÔNG đè
      # ENTRYPOINT). Hai cờ dưới đây vì thế đóng cứng "false":
      #
      #   Migration và sync notification-rule là việc của MỘT nơi duy nhất —
      #   backend. Trước bản vá 13-08-2026 hai cờ này nội suy
      #   ``${...:-true}`` giống backend, nghĩa là mỗi lần Compose dựng lại
      #   worker thì worker CŨNG chạy ``alembic upgrade head`` +
      #   ``sync_notification_rules``: ba tiến trình tranh nhau
      #   ``alembic_version`` và ghi đè notification-rule ba lượt cho một
      #   lần deploy.
      #
      #   Nó còn sinh ra một hệ quả âm thầm hơn: prod sau cold cutover mang
      #   env ``false``, còn model Compose lại nói ``true`` ⇒ **lệch model**,
      #   và Compose recreate container theo lệch model chứ không chỉ theo
      #   lệch image. Nên một bản vá không đụng gì tới Celery vẫn kéo cả hai
      #   container Celery đi lại vòng đời. Đóng cứng "false" khép cả hai
      #   vấn đề: đúng ngữ nghĩa, và model thôi trôi khỏi trạng thái thật.
      #
      # ``COLD_CUTOVER=true`` không cần đụng vào đây nữa: cờ này đã là
      # "false" sẵn, còn backend vẫn nhận ``export`` qua nội suy bên trên.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP: "false"
      # Casbin thì NGƯỢC LẠI — worker cần enforcer nạp policy để cưỡng chế
      # quyền trong task nền, nên cờ này vẫn đi theo cutover.
      RUN_CASBIN_LOAD_ON_STARTUP: ${RUN_CASBIN_LOAD_ON_STARTUP:-true}
    volumes:
      - backend_static_uploads:/app/app/static/uploads
      - backend_uploads:/app/uploads
      - sms_private_exports:/app/private_exports
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      disable: true
    logging: *default-logging

  # --- Celery Beat (SINGLETON - never scale beyond 1) ---
  celery-beat:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - ${QLTS_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qlts_production}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND_URL: redis://redis:6379/3
      # Celery beat cũng dùng chung entrypoint với backend — xem giải thích
      # đầy đủ ở service ``celery-worker``. Đóng cứng "false" vì cùng một
      # lý do, và với beat thì còn rõ hơn: beat là singleton lịch biểu,
      # không có việc gì phải chạm tới lược đồ CSDL lúc khởi động.
      RUN_MIGRATIONS_ON_STARTUP: "false"
      RUN_SYNC_NOTIFICATION_RULES_ON_STARTUP: "false"
      # Casbin vẫn theo cutover: beat kích task nền cần enforcer có policy.
      RUN_CASBIN_LOAD_ON_STARTUP: ${RUN_CASBIN_LOAD_ON_STARTUP:-true}
    volumes:
      - backend_static_uploads:/app/app/static/uploads
      - backend_uploads:/app/uploads
      - sms_private_exports:/app/private_exports
      - backend_logs:/app/logs
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
    healthcheck:
      disable: true
    logging: *default-logging

  # --- Frontend (Next.js Standalone) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-${NEXT_PUBLIC_API_URL}}
        NEXT_PUBLIC_FF_PERMISSION_HOOK: ${NEXT_PUBLIC_FF_PERMISSION_HOOK:-false}
        NEXT_PUBLIC_FF_ERROR_HANDLER: ${NEXT_PUBLIC_FF_ERROR_HANDLER:-false}
        NEXT_PUBLIC_FF_STATUS_CONFIG: ${NEXT_PUBLIC_FF_STATUS_CONFIG:-false}
        NEXT_PUBLIC_FF_STRICT_PERMISSIONS: ${NEXT_PUBLIC_FF_STRICT_PERMISSIONS:-false}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        # Chỉ để TRUY VẾT, không phải bằng chứng: nhãn nói người build KHAI SHA
        # nào, không nói ảnh chứa gì. Phép so nội dung nằm ở
        # `/app/.qlts-source-manifest.json` (xem `scripts/attest-frontend-runtime.sh`).
        # Để trống được — thiếu nhãn không làm hỏng attestation.
        QLTS_GIT_SHA: ${QLTS_GIT_SHA:-}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # --- Nginx (Reverse Proxy + SSL) ---
  nginx:
    <<: *nginx-base
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # --- Nginx CANDIDATE (chỉ dùng để thử, không publish cổng nào) ---
  # Dựng bản cấu hình MỚI cạnh bản đang phục vụ, đo hành vi thật của nó, rồi mới
  # quyết định có thay hay không. Trước bản vá này Step 8b `--force-recreate`
  # vô điều kiện: container tốt bị stop+remove TRƯỚC khi có gì được kiểm, và
  # một template hỏng / chứng thư thiếu / DOMAIN rỗng là mất cả :80 lẫn :443,
  # không đường lùi.
  #
  # Không có `ports:` nên nó không tranh 80/443 với bản đang chạy; đo bằng cách
  # gọi thẳng IP của nó trong mạng của project (xem scripts/nginx-verify.sh).
  # `restart: "no"` là cố ý: candidate hỏng phải NẰM YÊN ở trạng thái exited để
  # đọc được log, không được quay vòng.
  nginx-candidate:
    <<: *nginx-base
    profiles:
      - candidate
    restart: "no"

  # --- Nginx BOOTSTRAP (chỉ cho lần cấp chứng thư đầu tiên) ---
  # `scripts/setup-ssl.sh` dùng service này thay cho một `docker run` rời. Là
  # service thì nó nằm trong ĐÚNG project của Compose, nên volume `certbot_www`
  # được phân giải chuẩn — bản trước phải đoán tên volume từ `basename $(pwd)`
  # và đoán trượt khi chạy từ worktree.
  # Cổng 80 được xử lý CÓ CHỦ ĐÍCH ở script: dừng hẳn service `nginx` trước,
  # rồi mới dựng bootstrap. Bản trước `docker run -p 80:80` thẳng và chết với
  # "port is already allocated" nếu nginx production đang chạy hoặc đang quay
  # vòng — mà tiền đề "phải dừng nginx trước" không được ghi ở đâu cả.
  nginx-bootstrap:
    <<: *nginx-base
    profiles:
      - bootstrap
    restart: "no"
    ports:
      - "80:80"
    # Cấu hình bootstrap nằm ở đường RIÊNG trong image (nginx/Dockerfile), nên
    # không mount gì từ host cả.
    # `-c nginx-bootstrap.conf`: nginx.conf production khai `upstream backend`
    # và nginx phân giải hostname upstream NGAY LÚC NẠP CONFIG — trên VPS mới
    # thì backend chưa chạy và bootstrap sẽ chết với `[emerg] host not found in
    # upstream`. Đã tái hiện đúng như vậy trước khi tách tệp.
    # `$$1` vẫn là `nginx` nên entrypoint chính thức vẫn chạy envsubst.
    command: ["nginx", "-c", "/etc/nginx/nginx-bootstrap.conf", "-g", "daemon off;"]
    environment:
      <<: *nginx-env
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-bootstrap
    volumes:
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl --fail --silent --max-time 4
          http://127.0.0.1/qlts-bootstrap-alive)" = "qlts-bootstrap-alive"
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 5s

  # --- Certbot (SSL Certificate Management) ---
  certbot:
    image: certbot/certbot
    # Không có restart policy thì certbot KHÔNG dậy lại sau reboot VPS /
    # docker daemon restart => vòng lặp `certbot renew` 12h chết âm thầm và
    # chứng chỉ hết hạn mà không ai biết (nginx vẫn phục vụ cert cũ tới lúc
    # hết hạn). Dòng này đã được sửa TAY trên prod từ 2026-07-15 nhưng chưa
    # từng commit — đưa vào repo để prod và repo không còn lệch.
    restart: unless-stopped
    profiles:
      - production
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Auto-renewal: check every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  backend_static_uploads:
  sms_private_exports:  # PR-4: file Excel export SMS (PII) — private, ngoài webroot
  geoip_data:
  backend_logs:
  certbot_certs:
  certbot_www:
