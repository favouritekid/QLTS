# =============================================================================
# QLTS Development Overrides
# =============================================================================
# Automatically loaded by `docker compose up` (without --profile production)
# Provides hot-reload for backend and frontend development
# =============================================================================

services:
  backend:
    build:
      context: ./Backend_FastAPI
      dockerfile: Dockerfile
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    env_file:
      - ./Backend_FastAPI/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD:-qlts_dev}@postgres:5432/${POSTGRES_DB:-qlts_dev}
    volumes:
      - ./Backend_FastAPI:/app
    ports:
      - "8000:8000"

  celery-worker:
    command: celery -A app.celery_app worker -Q default,celery --loglevel=debug --concurrency=1
    env_file:
      - ./Backend_FastAPI/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD:-qlts_dev}@postgres:5432/${POSTGRES_DB:-qlts_dev}
    volumes:
      - ./Backend_FastAPI:/app

  celery-beat:
    command: celery -A app.celery_app beat --loglevel=debug
    env_file:
      - ./Backend_FastAPI/.env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qlts}:${POSTGRES_PASSWORD:-qlts_dev}@postgres:5432/${POSTGRES_DB:-qlts_dev}
    volumes:
      - ./Backend_FastAPI:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      # Persist Turbopack cache between restarts — avoids cold recompilation
      # (saves 5-17s per page on first visit after restart)
      - frontend_next_cache:/app/.next
    deploy:
      resources:
        limits:
          memory: 3G
    develop:
      watch:
        # Source code → sync into container, generates real inotify events
        # for Turbopack HMR (Windows bind mounts don't propagate inotify).
        # Requires: docker compose up --watch (or dev.cmd)
        - action: sync
          path: ./frontend/src
          target: /app/src

        # Test config → sync (needed for `npm run test` inside container)
        - action: sync
          path: ./frontend/vitest.config.ts
          target: /app/vitest.config.ts

        # Public assets → sync
        - action: sync
          path: ./frontend/public
          target: /app/public

        # Middleware → sync + restart dev server
        - action: sync+restart
          path: ./frontend/middleware.ts
          target: /app/middleware.ts

        # Config files → sync + restart dev server
        - action: sync+restart
          path: ./frontend/next.config.ts
          target: /app/next.config.ts

        - action: sync+restart
          path: ./frontend/tailwind.config.ts
          target: /app/tailwind.config.ts

        - action: sync+restart
          path: ./frontend/postcss.config.js
          target: /app/postcss.config.js

        - action: sync+restart
          path: ./frontend/tsconfig.json
          target: /app/tsconfig.json

        # Dependencies → rebuild image
        - action: rebuild
          path: ./frontend/package.json

        - action: rebuild
          path: ./frontend/package-lock.json

  postgres:
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qlts_dev}
      POSTGRES_DB: ${POSTGRES_DB:-qlts_dev}

  redis:
    ports:
      - "127.0.0.1:6380:6379"

volumes:
  frontend_next_cache:
